<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Code Trace — endless Python output puzzles</title>
<style>
  :root{
    --night-0:#0c0d2b; --night-1:#15123f; --night-2:#1d1850;
    --surface:#221c57; --surface-soft:#2a2466; --ink:#090a1c;
    --cream:#f4eddd; --cream-dim:#bdb6d8;
    --saffron:#f2a93b; --saffron-soft:#f6c878;
    --jade:#74d6c3; --lotus:#c9a7f0; --coral:#f0856f;
    --hair:rgba(244,237,221,0.12);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Monaco,"Cascadia Code",Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 700px at 80% -10%, #2a2068 0%, transparent 55%),
      radial-gradient(900px 600px at 0% 110%, #241a5a 0%, transparent 50%),
      linear-gradient(160deg, var(--night-0), var(--night-1) 60%, var(--night-2));
    color:var(--cream); font-family:var(--sans); line-height:1.55; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:700px;margin:0 auto;padding:18px 16px 60px;}
  header.top{text-align:center;margin-bottom:10px;}
  .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--saffron);opacity:.85;}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(26px,8vw,40px);margin:6px 0 4px;}
  h1 .glow{color:var(--saffron-soft);}
  .sub{color:var(--cream-dim);font-size:13.5px;max-width:44ch;margin:0 auto;}

  .nav{display:flex;justify-content:center;gap:7px;margin:12px 0 10px;flex-wrap:wrap;}
  .pill{font-size:12.5px;font-weight:600;border:1px solid var(--hair);background:var(--surface);color:var(--cream-dim);border-radius:999px;padding:7px 13px;cursor:pointer;text-decoration:none;display:inline-block;}
  .pill:hover{color:var(--cream);}
  .pill.active{background:var(--saffron);color:var(--night-0);border-color:var(--saffron);}
  .chips{display:flex;justify-content:center;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .chip{font-size:11.5px;font-weight:600;border:1px solid var(--hair);background:var(--surface-soft);color:var(--cream-dim);border-radius:999px;padding:5px 11px;cursor:pointer;}
  .chip.active{background:rgba(116,214,195,.16);border-color:rgba(116,214,195,.45);color:var(--jade);}

  .rankbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .rankbar .rk{font-family:var(--serif);font-size:14px;color:var(--saffron-soft);white-space:nowrap;}
  .xpbar{flex:1;height:9px;border-radius:999px;background:var(--surface);overflow:hidden;border:1px solid var(--hair);}
  .xpbar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lotus),#9d6fe0);transition:width .35s ease;}
  .rankbar .xp{font-family:var(--mono);font-size:11px;color:var(--cream-dim);white-space:nowrap;}

  .stats{display:flex;gap:9px;justify-content:center;margin-bottom:13px;flex-wrap:wrap;}
  .stat{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:7px 13px;text-align:center;min-width:80px;}
  .stat .n{font-family:var(--serif);font-size:19px;line-height:1;}
  .stat .l{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--cream-dim);margin-top:3px;}
  .stat.stars .n{color:var(--saffron-soft);}
  .stat.streak .n{color:var(--jade);}
  .stat.solved .n{color:var(--lotus);}

  .card{background:linear-gradient(180deg,var(--surface),rgba(29,24,80,.7));border:1px solid var(--hair);border-radius:20px;padding:18px 16px;box-shadow:0 16px 40px -24px rgba(0,0,0,.8);}
  .qrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;gap:8px;}
  .qlabel{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--saffron);}
  .qtopic{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--jade);background:rgba(116,214,195,.1);border:1px solid rgba(116,214,195,.28);border-radius:999px;padding:3px 9px;}
  .qworth{font-family:var(--mono);font-size:11px;color:var(--saffron-soft);}
  .ask{font-size:15px;color:var(--cream);margin:0 0 10px;}
  .ask b{color:var(--saffron-soft);}

  .editor{background:var(--ink);border:1px solid rgba(244,237,221,.10);border-radius:13px;overflow:hidden;}
  .ebar{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid rgba(244,237,221,.07);}
  .ebar .d{width:10px;height:10px;border-radius:50%;}
  .ebar .r{background:#ff6b6b;}.ebar .y{background:#ffce5b;}.ebar .g{background:#74d6c3;}
  .ebar .fn{margin-left:6px;font-family:var(--mono);font-size:11px;color:var(--cream-dim);}
  .code{padding:12px 8px 12px 0;font-family:var(--mono);font-size:13.5px;line-height:1.65;overflow-x:auto;}
  .cl{display:flex;}
  .cl .ln{width:34px;flex:0 0 34px;text-align:right;padding-right:12px;color:#5b5687;user-select:none;}
  .cl .lt{white-space:pre;color:#e9e3ff;}

  .alabel{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cream-dim);margin:15px 0 7px;}
  textarea.ans{width:100%;min-height:58px;resize:vertical;background:var(--ink);border:1px solid var(--hair);border-radius:11px;color:var(--cream);font-family:var(--mono);font-size:14px;line-height:1.6;padding:11px 13px;outline:none;}
  textarea.ans:focus{border-color:var(--saffron);}
  .hintNote{font-size:11px;color:var(--cream-dim);margin-top:5px;}

  .hints{margin-top:12px;}
  .hint-bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
  .hint-bar .htitle{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--cream-dim);margin-right:2px;}
  .hbtn{font-size:12.5px;font-weight:600;border:1px solid rgba(201,167,240,.35);background:rgba(201,167,240,.10);color:var(--lotus);border-radius:999px;padding:6px 11px;cursor:pointer;}
  .hbtn:disabled{opacity:.4;cursor:not-allowed;}
  .hbtn.used{background:rgba(116,214,195,.12);border-color:rgba(116,214,195,.4);color:var(--jade);cursor:default;}
  .hint-out{margin-top:9px;display:flex;flex-direction:column;gap:6px;}
  .hint-card{background:rgba(201,167,240,.08);border:1px solid rgba(201,167,240,.22);border-radius:10px;padding:8px 11px;font-size:13.5px;color:var(--cream);}
  .hint-card b{color:var(--lotus);}
  .hint-card .c{font-family:var(--mono);font-size:12.5px;background:rgba(9,10,28,.6);padding:1px 5px;border-radius:5px;color:var(--jade);}

  .controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  button{font-family:var(--sans);font-size:14.5px;font-weight:600;border:0;border-radius:11px;padding:11px 18px;cursor:pointer;transition:transform .1s ease,filter .15s ease;}
  button:active{transform:translateY(1px);}
  .btn-check{background:linear-gradient(160deg,var(--saffron),#dd8e23);color:var(--night-0);}
  .btn-next{background:linear-gradient(160deg,var(--jade),#48b6a2);color:var(--night-0);}
  .btn-ghost{background:transparent;color:var(--cream-dim);border:1px solid var(--hair);font-weight:500;}

  .fb{margin-top:13px;border-radius:12px;padding:12px 14px;font-size:14.5px;display:none;}
  .fb.show{display:block;}
  .fb.win{background:rgba(116,214,195,.12);border:1px solid rgba(116,214,195,.4);}
  .fb.win b{color:var(--jade);}
  .fb.miss{background:rgba(240,133,111,.10);border:1px solid rgba(240,133,111,.4);}
  .fb.miss b{color:var(--coral);}
  .fb.almost{background:rgba(242,169,59,.10);border:1px solid rgba(242,169,59,.4);}
  .fb.almost b{color:var(--saffron-soft);}
  .fb .real{display:block;margin-top:7px;font-family:var(--mono);font-size:13.5px;background:rgba(9,10,28,.55);border-radius:8px;padding:8px 10px;color:var(--cream);white-space:pre-wrap;}
  .fb .why{margin-top:8px;font-size:13.5px;color:var(--cream-dim);}
  .fb .why b{color:var(--lotus);}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(40px);background:linear-gradient(160deg,#2a2466,#1d1850);border:1px solid rgba(246,200,120,.5);color:var(--cream);border-radius:14px;padding:12px 18px;font-size:14px;font-weight:600;box-shadow:0 18px 40px -16px rgba(0,0,0,.8);opacity:0;transition:opacity .3s ease,transform .3s ease;z-index:60;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast b{color:var(--saffron-soft);}

  .footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:0 4px;}
  .footer small{color:var(--cream-dim);font-size:11.5px;}
  .footer .reset{background:none;border:0;color:var(--cream-dim);font-size:11.5px;text-decoration:underline;cursor:pointer;padding:0;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="kicker">read code like Python does</div>
    <h1>Code <span class="glow">Trace</span></h1>
    <p class="sub">Real multi-line Python. Predict what it prints. Earn ⭐ &amp; XP, climb the ranks, spend ⭐ on hints.</p>
  </header>

  <div class="nav">
    <a class="pill" href="index.html" style="text-decoration:none;">← Lessons &amp; AI</a>
    <button class="pill lvl active" data-mode="easy">Easy</button>
    <button class="pill lvl" data-mode="medium">Medium</button>
    <button class="pill lvl" data-mode="hard">Hard</button>
    <button class="pill lvl" data-mode="mix">Mix 🎲</button>
  </div>
  <div class="chips" id="topicChips"></div>

  <div class="rankbar">
    <span class="rk" id="rankName">🥚 Hatchling</span>
    <div class="xpbar"><i id="xpFill"></i></div>
    <span class="xp" id="xpText">0 XP</span>
  </div>

  <div class="stats">
    <div class="stat stars"><div class="n" id="stStars">5</div><div class="l">stars</div></div>
    <div class="stat streak"><div class="n" id="stStreak">0</div><div class="l">streak</div></div>
    <div class="stat solved"><div class="n" id="stSolved">0</div><div class="l">solved</div></div>
  </div>

  <main class="card" id="card"></main>

  <div class="footer">
    <small>Type the output exactly, line by line.</small>
    <button class="reset" id="resetBtn">Reset progress</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   mini-py — a tiny Python interpreter (pure JS). Used here to
   COMPUTE the correct output of every generated program, so the
   game's answers are always right. Cross-checked against real
   CPython during development. Supports: print, variables,
   f-strings, + - * // % **, comparisons, and/or/not, in, lists,
   indexing, .append, len, sum, min, max, abs, round, dicts,
   .items/.get/.keys/.values, range, for, while, if/elif/else,
   def/return (defaults), .upper/.lower/.title/.count, comments.
   (Intentionally avoids true division / and slicing.)
   ============================================================ */
function pyError(msg){const e=new Error(msg);e.__pyerr=true;return e;}
function toLogicalLines(src){
  const phys=src.replace(/\r\n/g,"\n").replace(/\t/g,"    ").split("\n");
  const res=[]; let i=0;
  while(i<phys.length){
    let raw=phys[i]; const indent=raw.length-raw.trimStart().length;
    let {text,depth,open}=scanLine(raw); let buf=text;
    while(open && i+1<phys.length){ i++; const nxt=scanLine(phys[i]); buf+=" "+nxt.text.trim(); open=nxt.openFrom(depth); depth=nxt.depthFrom(depth); }
    if(buf.trim().length>0) res.push({indent,text:buf}); i++;
  }
  return res;
}
function scanLine(line){
  let s="",depth=0,inStr=false,q="",esc=false;
  for(let k=0;k<line.length;k++){ const c=line[k];
    if(inStr){ s+=c; if(esc){esc=false;} else if(c==="\\"){esc=true;} else if(c===q){inStr=false;} continue; }
    if(c==="'"||c==='"'){inStr=true;q=c;s+=c;continue;}
    if(c==="#"){break;}
    if(c==="("||c==="["||c==="{")depth++;
    if(c===")"||c==="]"||c==="}")depth--;
    s+=c;
  }
  return {text:s,depth,open:depth>0,openFrom:(d)=>(d+depth)>0,depthFrom:(d)=>d+depth};
}
function parseBlock(lines,st,parentIndent){
  const body=[]; if(st.i>=lines.length) return body;
  const indent=lines[st.i].indent; if(indent<=parentIndent) return body;
  while(st.i<lines.length && lines[st.i].indent===indent){ body.push(parseStatement(lines,st,indent)); }
  return body;
}
function parseStatement(lines,st,indent){
  const text=lines[st.i].text.trim(); let m;
  if((m=/^if\s+(.*):$/.exec(text))){
    st.i++; const cond=parseExpr(m[1]); const branches=[{cond,body:parseBlock(lines,st,indent)}]; let els=null;
    while(st.i<lines.length && lines[st.i].indent===indent){ const t=lines[st.i].text.trim(); let em;
      if((em=/^elif\s+(.*):$/.exec(t))){ st.i++; branches.push({cond:parseExpr(em[1]),body:parseBlock(lines,st,indent)}); }
      else if(/^else\s*:$/.test(t)){ st.i++; els=parseBlock(lines,st,indent); break; } else break; }
    return {t:"if",branches,els};
  }
  if((m=/^for\s+(.*?)\s+in\s+(.*):$/.exec(text))){ st.i++; const targets=m[1].split(",").map(s=>s.trim()); const iter=parseExpr(m[2]); return {t:"for",targets,iter,body:parseBlock(lines,st,indent)}; }
  if((m=/^while\s+(.*):$/.exec(text))){ st.i++; return {t:"while",cond:parseExpr(m[1]),body:parseBlock(lines,st,indent)}; }
  if((m=/^def\s+([A-Za-z_]\w*)\s*\((.*)\)\s*:$/.exec(text))){ st.i++; return {t:"def",name:m[1],params:parseParams(m[2]),body:parseBlock(lines,st,indent)}; }
  if((m=/^return\b(.*)$/.exec(text))){ st.i++; const ex=m[1].trim(); return {t:"return",expr:ex?parseExpr(ex):{t:"none"}}; }
  st.i++;
  const eq=findTopAssign(text);
  if(eq>=0){ return {t:"assign",target:text.slice(0,eq).trim(),expr:parseExpr(text.slice(eq+1).trim())}; }
  return {t:"expr",expr:parseExpr(text)};
}
function parseParams(s){ s=s.trim(); if(!s) return []; return splitTop(s,",").map(p=>{ const e=findTopAssign(p); if(e>=0) return {name:p.slice(0,e).trim(),def:parseExpr(p.slice(e+1).trim())}; return {name:p.trim(),def:null}; }); }
function splitTop(s,sep){ const parts=[]; let depth=0,inStr=false,q="",esc=false,cur=""; for(let k=0;k<s.length;k++){ const c=s[k];
  if(inStr){ cur+=c; if(esc)esc=false; else if(c==="\\")esc=true; else if(c===q)inStr=false; continue; }
  if(c==="'"||c==='"'){inStr=true;q=c;cur+=c;continue;}
  if(c==="("||c==="["||c==="{"){depth++;cur+=c;continue;}
  if(c===")"||c==="]"||c==="}"){depth--;cur+=c;continue;}
  if(c===sep&&depth===0){parts.push(cur);cur="";continue;} cur+=c; }
  if(cur.trim().length) parts.push(cur); return parts; }
function findTopAssign(text){ let depth=0,inStr=false,q="",esc=false; for(let k=0;k<text.length;k++){ const c=text[k];
  if(inStr){ if(esc)esc=false; else if(c==="\\")esc=true; else if(c===q)inStr=false; continue; }
  if(c==="'"||c==='"'){inStr=true;q=c;continue;}
  if(c==="("||c==="["||c==="{")depth++; else if(c===")"||c==="]"||c==="}")depth--;
  else if(c==="="&&depth===0){ const prev=text[k-1],next=text[k+1]; if(next==="="){k++;continue;} if(prev==="="||prev==="!"||prev===">"||prev==="<")continue; return k; } }
  return -1; }
function tokenize(s){ const toks=[]; let k=0; const isId=c=>/[A-Za-z_]/.test(c),isIdc=c=>/[A-Za-z0-9_]/.test(c),isD=c=>/[0-9]/.test(c);
  while(k<s.length){ const c=s[k];
    if(c===" "||c==="\t"){k++;continue;}
    if((c==="f"||c==="F")&&(s[k+1]==='"'||s[k+1]==="'")){ const q=s[k+1]; let j=k+2,val="",esc=false; while(j<s.length){const d=s[j];if(esc){val+=d;esc=false;}else if(d==="\\"){val+=d;esc=true;}else if(d===q){break;}else val+=d;j++;} toks.push({t:"fstr",v:val}); k=j+1; continue; }
    if(c==='"'||c==="'"){ const q=c; let j=k+1,val="",esc=false; while(j<s.length){const d=s[j];if(esc){val+=unesc(d);esc=false;}else if(d==="\\"){esc=true;}else if(d===q){break;}else val+=d;j++;} toks.push({t:"str",v:val}); k=j+1; continue; }
    if(isD(c)||(c==="."&&isD(s[k+1]))){ let j=k,num=""; while(j<s.length&&/[0-9.]/.test(s[j])){num+=s[j];j++;} toks.push({t:"num",v:parseFloat(num)}); k=j; continue; }
    if(isId(c)){ let j=k,id=""; while(j<s.length&&isIdc(s[j])){id+=s[j];j++;}
      if(id==="True")toks.push({t:"bool",v:true}); else if(id==="False")toks.push({t:"bool",v:false}); else if(id==="None")toks.push({t:"none"});
      else if(id==="and"||id==="or"||id==="not"||id==="in")toks.push({t:"kw",v:id}); else toks.push({t:"name",v:id}); k=j; continue; }
    const two=s.slice(k,k+2); if(["==","!=",">=","<="].includes(two)){toks.push({t:"op",v:two});k+=2;continue;}
    if("+-*/%<>()[]{}:,.".includes(c)){toks.push({t:"op",v:c});k++;continue;}
    throw pyError("SyntaxError: unexpected character '"+c+"'"); }
  return toks; }
function unesc(d){return d==="n"?"\n":d==="t"?"\t":d;}
function parseExpr(str){ const toks=tokenize(str); const p={toks,i:0}; const node=parseOr(p); if(p.i<toks.length) throw pyError("SyntaxError: unexpected token"); return node; }
function peek(p){return p.toks[p.i];}
function eat(p,v){const t=p.toks[p.i];if(!t||(v&&!(t.v===v||t.t===v)))throw pyError("SyntaxError near '"+(t?t.v:"end")+"'");p.i++;return t;}
function parseOr(p){let l=parseAnd(p);while(peek(p)&&peek(p).t==="kw"&&peek(p).v==="or"){p.i++;l={t:"bin",op:"or",l,r:parseAnd(p)};}return l;}
function parseAnd(p){let l=parseNot(p);while(peek(p)&&peek(p).t==="kw"&&peek(p).v==="and"){p.i++;l={t:"bin",op:"and",l,r:parseNot(p)};}return l;}
function parseNot(p){if(peek(p)&&peek(p).t==="kw"&&peek(p).v==="not"){p.i++;return {t:"unary",op:"not",e:parseNot(p)};}return parseCmp(p);}
function parseCmp(p){let l=parseAdd(p);while(peek(p)&&((peek(p).t==="op"&&["<",">","==","!=",">=","<="].includes(peek(p).v))||(peek(p).t==="kw"&&peek(p).v==="in"))){const op=peek(p).v;p.i++;l={t:"bin",op,l,r:parseAdd(p)};}return l;}
function parseAdd(p){let l=parseMul(p);while(peek(p)&&peek(p).t==="op"&&(peek(p).v==="+"||peek(p).v==="-")){const op=peek(p).v;p.i++;l={t:"bin",op,l,r:parseMul(p)};}return l;}
function parseMul(p){let l=parseUnary(p);while(peek(p)&&peek(p).t==="op"&&["*","/","%"].includes(peek(p).v)){const op=peek(p).v;p.i++;l={t:"bin",op,l,r:parseUnary(p)};}return l;}
function parseUnary(p){if(peek(p)&&peek(p).t==="op"&&peek(p).v==="-"){p.i++;return {t:"unary",op:"-",e:parseUnary(p)};}return parsePostfix(p);}
function parsePostfix(p){ let e=parsePrimary(p);
  while(peek(p)&&peek(p).t==="op"&&(peek(p).v==="."||peek(p).v==="("||peek(p).v==="[")){ const op=peek(p).v;
    if(op==="."){p.i++;const nm=eat(p,"name").v;e={t:"attr",obj:e,name:nm};}
    else if(op==="("){p.i++;const args=[];if(!(peek(p)&&peek(p).v===")")){args.push(parseOr(p));while(peek(p)&&peek(p).v===","){p.i++;args.push(parseOr(p));}}eat(p,")");e={t:"call",fn:e,args};}
    else {p.i++;const idx=parseOr(p);eat(p,"]");e={t:"index",obj:e,idx};} }
  return e; }
function parsePrimary(p){ const t=peek(p); if(!t)throw pyError("SyntaxError: unexpected end");
  if(t.t==="num"){p.i++;return {t:"num",v:t.v};}
  if(t.t==="str"){p.i++;return {t:"str",v:t.v};}
  if(t.t==="fstr"){p.i++;return {t:"fstr",v:t.v};}
  if(t.t==="bool"){p.i++;return {t:"bool",v:t.v};}
  if(t.t==="none"){p.i++;return {t:"none"};}
  if(t.t==="name"){p.i++;return {t:"name",v:t.v};}

  {topic:"lists",gen:()=>{const arr=pickn([3,7,2,9,5,1,8,6],ri(4,5));const m=Math.max(...arr);return{code:`nums = [${arr.join(", ")}]\nbest = nums[0]\nfor n in nums:\n    if n > best:\n        best = n\nprint(best)`,concept:"find the biggest value by hand (running max)",why:`best starts at the first item (${arr[0]}). Each time a number is bigger than best, best updates to it. The largest in ${arr.join(", ")} is ${m}.`};}},
  {topic:"functions",gen:()=>{const qs=pickn([1,2,3,4,5],3);const lines=qs.map(q=>`${q} costs ${q*10}`).join("  |  ");return{code:`def price(qty):\n    return qty * 10\n\nfor q in [${qs.join(", ")}]:\n    print(f"{q} costs {price(q)}")`,concept:"call a function from inside an f-string",why:`price(q) returns q * 10. The f-string fills in q and price(q) for each q: ${lines}.`};}},
  {topic:"conditionals",gen:()=>{const x=ri(-5,9);let r;if(x>0)r=(x%2===0)?"positive even":"positive odd";else r="not positive";return{code:`x = ${x}\nif x > 0:\n    if x % 2 == 0:\n        print("positive even")\n    else:\n        print("positive odd")\nelse:\n    print("not positive")`,concept:"an if inside an if (nested conditions)",why:`x is ${x}. Outer check x > 0 is ${x>0?"True":"False"}. ${x>0?`Inside, x % 2 == 0 is ${x%2===0?"True":"False"}, so it prints "${r}".`:`So it jumps to else and prints "not positive".`}`};}},
  {topic:"loops",gen:()=>{const n=ri(4,6);let t=0;const parts=[];for(let i=1;i<=n;i++)if(i%2===0){t+=i*i;parts.push(`${i}*${i}`);}return{code:`total = 0\nfor i in range(1, ${n+1}):\n    if i % 2 == 0:\n        total = total + i * i\nprint(total)`,concept:"combine a loop, an if, and math",why:`Only even i pass the if. Their squares ${parts.join(" + ")} add up to ${t}.`};}},
  {topic:"functions",gen:()=>{const e=ri(3,4),b=ri(2,3);const r1=Math.pow(b,2),r2=Math.pow(b,e);return{code:`def power(base, exp=2):\n    result = 1\n    for i in range(exp):\n        result = result * base\n    return result\n\nprint(power(${b}))\nprint(power(${b}, ${e}))`,concept:"default arguments + a loop that multiplies",why:`power multiplies result by base, exp times. power(${b}) uses the default exp=2 → ${b}*${b} = ${r1}. power(${b}, ${e}) multiplies ${b} ${e} times = ${r2}.`};}},
  {topic:"loops",gen:()=>{const n=ri(2,5);const lines=[1,2,3].map(i=>`${n} x ${i} = ${n*i}`).join("  |  ");return{code:`n = ${n}\nfor i in range(1, 4):\n    print(n, "x", i, "=", n * i)`,concept:"print() joins several values with spaces",why:`i runs 1, 2, 3. Each line prints n, "x", i, "=", and n*i with spaces between: ${lines}.`};}},
  {topic:"strings",gen:()=>{const arr=pickn(LETTERS,3);const res=arr.map(w=>w+"-").join("");return{code:`words = [${arr.map(x=>`"${x}"`).join(", ")}]\nsentence = ""\nfor w in words:\n    sentence = sentence + w + "-"\nprint(sentence)`,concept:"build one string from a list of pieces",why:`sentence starts empty. Each loop adds the word plus "-", in order, giving "${res}". Note the trailing dash — every word gets one, including the last.`};}},
  {topic:"functions",gen:()=>{const arr=pickn([2,3,4,5,6],3);const dbl=arr.map(n=>n*2);const t=dbl.reduce((a,b)=>a+b,0);return{code:`def double(n):\n    return n * 2\n\ntotal = 0\nfor n in [${arr.join(", ")}]:\n    total = total + double(n)\nprint(total)`,concept:"use a function's result inside a running total",why:`double(n) returns n*2. The loop adds each doubled value: ${dbl.join(" + ")} = ${t}.`};}},
 ]
};

/* ===== topics for the filter ===== */
const TOPICS=[["all","All"],["loops","Loops"],["conditionals","If/Else"],["functions","Functions"],["strings","Strings"],["lists","Lists"],["dicts","Dicts"]];

/* ===== ranks ===== */
const RANKS=[[0,"🥚 Hatchling"],[40,"🌱 Sprout"],[110,"🐍 Coder"],[220,"🔥 Sharp"],[380,"⚡ Pro"],[600,"🏆 Master"],[900,"🧙 Wizard"],[1300,"🌟 Legend"]];
function rankFor(xp){ let r=RANKS[0],nxt=null; for(let i=0;i<RANKS.length;i++){ if(xp>=RANKS[i][0]){r=RANKS[i];nxt=RANKS[i+1]||null;} } return {name:r[1],base:r[0],next:nxt}; }

/* ===== persistence ===== */
const SK={stars:"ct-stars",streak:"ct-streak",solved:"ct-solved",xp:"ct-xp",badges:"ct-badges"};
function ld(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
let stars=ld(SK.stars,5), streak=ld(SK.streak,0), solved=ld(SK.solved,0), xp=ld(SK.xp,0);
let badges=ld(SK.badges,[]);
let mode="easy", topic="all", cur=null, attempts=0, solvedThis=false, bought=[];

/* ===== badges ===== */
const BADGES=[
 {id:"hard1",test:()=>cur&&cur.level===3&&solvedThis,label:"💪 Cracked your first Hard!"},
 {id:"s5",test:()=>streak===5,label:"🔥 5 in a row!"},
 {id:"s10",test:()=>streak===10,label:"⚡ 10 streak — on fire!"},
 {id:"s20",test:()=>streak===20,label:"🌟 20 streak — unstoppable!"},
 {id:"solved25",test:()=>solved===25,label:"🎯 25 puzzles solved!"},
 {id:"solved100",test:()=>solved===100,label:"🏅 100 puzzles solved!"},
];
let toastTimer=null;
function toast(msg){ const t=document.getElementById("toast"); t.innerHTML=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2600); }
function checkBadges(){ for(const b of BADGES){ if(!badges.includes(b.id) && b.test()){ badges.push(b.id); sv(SK.badges,badges); toast("<b>Badge unlocked</b> · "+b.label); break; } } }

/* ===== stats / rank UI ===== */
function updateStats(){
  document.getElementById("stStars").textContent=stars;
  document.getElementById("stStreak").textContent=streak;
  document.getElementById("stSolved").textContent=solved;
  const r=rankFor(xp);
  document.getElementById("rankName").textContent=r.name;
  if(r.next){ const span=r.next[0]-r.base, into=xp-r.base; document.getElementById("xpFill").style.width=Math.min(100,Math.round(into/span*100))+"%"; document.getElementById("xpText").textContent=`${xp} XP · ${r.next[0]-xp} to ${r.next[1].replace(/^\S+\s/,"")}`; }
  else { document.getElementById("xpFill").style.width="100%"; document.getElementById("xpText").textContent=`${xp} XP · max rank`; }
}

/* ===== question generation (output computed by runPy) ===== */
function poolFor(){
  let lvls = mode==="mix"?[1,2,3]:[{easy:1,medium:2,hard:3}[mode]];
  let items=[];
  for(const lv of lvls) for(const it of GEN[lv]) if(topic==="all"||it.topic===topic) items.push({lv,it});
  if(!items.length){ for(const lv of lvls) for(const it of GEN[lv]) items.push({lv,it}); } // relax topic
  return items;
}
function newQuestion(){
  const pool=poolFor();
  for(let tries=0;tries<25;tries++){
    const {lv,it}=pick(pool);
    const q=it.gen();
    const res=runPy(q.code);
    if(!res.err && res.out.trim().length){ q.out=res.out.replace(/\n$/,""); q.level=lv; q.topic=it.topic; return q; }
  }
  // ultra-safe fallback
  const a=ri(2,9),b=ri(2,9);
  return {code:`a = ${a}\nb = ${b}\nprint(a + b)`,out:String(a+b),level:1,topic:"basics",concept:"variables and +",why:`${a}+${b}=${a+b}.`};
}

/* ===== hints ===== */
function shapeHint(out){
  if(out.includes("\n")) return `It prints <b>${out.split("\n").length} lines</b>.`;
  if(out==="True"||out==="False") return `The answer is just <b>True</b> or <b>False</b>.`;
  if(/^-?\d+$/.test(out)) return `The output is <b>one whole number</b>.`;
  if(out.startsWith("[")) return `The output is a <b>list</b> like <span class="c">[ ... ]</span>.`;
  if(out.startsWith("{")) return `The output is a <b>dictionary</b> like <span class="c">{ ... }</span>.`;
  return `The output is <b>text</b> (${out.length} characters).`;
}
function revealHint(out){
  if(out.includes("\n")){ return `The first line is: <span class="c">${esc(out.split("\n")[0])}</span>`; }
  if(out.length<=2) return `It starts with <span class="c">${esc(out[0])}</span> (very short).`;
  return `It starts with <span class="c">${esc(out.slice(0,Math.max(1,Math.ceil(out.length/3))))}</span>…`;
}
const HINTS=[
 {cost:1,label:"Concept",make:q=>`<b>Concept:</b> ${q.concept}.`},
 {cost:2,label:"Shape",make:q=>`<b>Shape:</b> ${shapeHint(q.out)}`},
 {cost:3,label:"Reveal start",make:q=>`<b>Reveal:</b> ${revealHint(q.out)}`},
];
function renderHintBar(){
  const bar=document.getElementById("hintBar"); if(!bar) return;
  bar.querySelectorAll(".hbtn").forEach((btn,i)=>{ const h=HINTS[i];
    if(bought.includes(i)){ btn.classList.add("used"); btn.disabled=true; btn.textContent=h.label+" ✓"; }
    else { btn.disabled = solvedThis || stars<h.cost; btn.textContent=`${h.label} (${h.cost}⭐)`; } });
}
function buyHint(i){
  if(solvedThis||bought.includes(i)) return; const h=HINTS[i]; if(stars<h.cost) return;
  stars-=h.cost; sv(SK.stars,stars); bought.push(i); updateStats();
  const div=document.createElement("div"); div.className="hint-card"; div.innerHTML=h.make(cur);
  document.getElementById("hintOut").appendChild(div); renderHintBar();
}

/* ===== rendering ===== */
function codeHtml(code){ return code.split("\n").map((ln,i)=>`<div class="cl"><span class="ln">${i+1}</span><span class="lt">${esc(ln)||" "}</span></div>`).join(""); }
const LVLNAME=["","Easy","Medium","Hard"];
function worth(lv){ return "⭐".repeat(lv)+` · +${lv*10} XP`; }
function render(){
  attempts=0; solvedThis=false; bought=[]; cur=newQuestion(); updateStats();
  document.getElementById("card").innerHTML=`
    <div class="qrow">
      <span class="qlabel">${LVLNAME[cur.level]} · trace it</span>
      <span class="qtopic">${cur.topic}</span>
    </div>
    <div class="ask">What does this program <b>print</b>? <span style="color:var(--saffron-soft);font-size:12px;">(worth ${worth(cur.level)})</span></div>
    <div class="editor">
      <div class="ebar"><span class="d r"></span><span class="d y"></span><span class="d g"></span><span class="fn">trace.py</span></div>
      <div class="code">${codeHtml(cur.code)}</div>
    </div>
    <div class="alabel"><span>⌨</span> Your answer (one line per printed line)</div>
    <textarea class="ans" id="ans" spellcheck="false" placeholder="Type exactly what gets printed…"></textarea>
    <div class="hints">
      <div class="hint-bar" id="hintBar">
        <span class="htitle">Stuck? Hints:</span>
        <button class="hbtn" data-h="0"></button>
        <button class="hbtn" data-h="1"></button>
        <button class="hbtn" data-h="2"></button>
      </div>
      <div class="hint-out" id="hintOut"></div>
    </div>
    <div class="controls">
      <button class="btn-check" id="checkBtn">Check</button>
      <button class="btn-ghost" id="giveBtn">Show answer</button>
      <button class="btn-ghost" id="skipBtn">Skip →</button>
    </div>
    <div class="fb" id="fb"></div>`;
  const ans=document.getElementById("ans"); ans.focus();
  ans.addEventListener("keydown",e=>{ if((e.ctrlKey||e.metaKey)&&e.key==="Enter") check(); });
  document.getElementById("checkBtn").addEventListener("click",check);
  document.getElementById("giveBtn").addEventListener("click",giveUp);
  document.getElementById("skipBtn").addEventListener("click",next);
  document.querySelectorAll("#hintBar .hbtn").forEach(b=>b.addEventListener("click",()=>buyHint(parseInt(b.dataset.h,10))));
  renderHintBar();
}
function realBlock(){ return `<span class="real">${esc(cur.out)}</span>`
  +`<div class="why"><b>Step by step:</b> ${cur.why}</div>`
  +`<div class="why" style="margin-top:5px;"><b>The idea:</b> ${cur.concept}.</div>`; }
function showFb(kind,html){ const fb=document.getElementById("fb"); fb.className="fb "+kind+" show"; fb.innerHTML=html; }
function lockSolved(){
  solvedThis=true;
  document.getElementById("checkBtn").style.display="none";
  document.getElementById("giveBtn").style.display="none";
  const skip=document.getElementById("skipBtn"); skip.textContent="Next →"; skip.className="btn-next";
  renderHintBar();
}

function check(){
  if(solvedThis) return;
  const user=norm(document.getElementById("ans").value);
  const expect=norm(cur.out);
  if(user===expect){
    const firstTry = attempts===0 && bought.length===0;
    const sReward=cur.level, xReward=cur.level*10;
    stars+=sReward; xp+=xReward; solved++;
    if(firstTry) streak++;
    sv(SK.stars,stars); sv(SK.xp,xp); sv(SK.solved,solved); sv(SK.streak,streak);
    updateStats();
    let extra = firstTry?` <b>+${sReward}⭐ · +${xReward} XP</b>` : ` +${sReward}⭐ · +${xReward} XP (you got there — that counts!)`;
    let sb = (firstTry && streak>0 && streak%5===0)?` 🔥 ${streak} streak!`:"";
    showFb("win","<b>✓ Correct!</b>"+extra+sb+realBlock());
    lockSolved(); checkBadges();
    return;
  }
  // wrong — explain why, then let them retry (full walkthrough after the 2nd miss)
  attempts++; streak=0; sv(SK.streak,streak); updateStats();
  const caseOnly = user.length && user.toLowerCase()===expect.toLowerCase();
  let nudge;
  if(!user) nudge="Type what the program prints — one line for each thing it prints.";
  else if(caseOnly) nudge="Right letters, but Python is <b>case-sensitive</b> — check your capitals (e.g. <span class='c'>True</span>, not <span class='c'>true</span>).";
  else if(user.split("\n").length!==expect.split("\n").length) nudge=`Your answer has <b>${user.split("\n").length} line(s)</b>, but this program prints <b>${expect.split("\n").length} line(s)</b>. Count the <span class='c'>print()</span>s — and how many times each loop repeats.`;
  else nudge="Right number of lines — but a value is off. Re-check the arithmetic, or which branch the <span class='c'>if</span> takes.";
  if(attempts>=2){
    showFb("miss","<b>Let's walk through it together.</b> "+nudge+realBlock());
    lockSolved();
  } else {
    showFb(caseOnly?"almost":"miss","<b>Not quite — try again.</b> "+nudge
      +`<div class="why" style="margin-top:6px;"><b>The idea:</b> ${cur.concept}. <span style="color:var(--cream-dim)">(Try once more — your answer stays. A hint reveals the shape or the start; the full walkthrough shows after another try.)</span></div>`);
  }
}
function giveUp(){
  if(solvedThis) return;
  streak=0; sv(SK.streak,streak); updateStats();
  showFb("almost","<b>Here's the answer:</b>"+realBlock());
  lockSolved();
}
function next(){ render(); }

/* ===== selectors ===== */
document.querySelectorAll(".pill.lvl").forEach(p=>p.addEventListener("click",()=>{
  document.querySelectorAll(".pill.lvl").forEach(x=>x.classList.remove("active"));
  p.classList.add("active"); mode=p.dataset.mode; render();
}));
(function buildTopics(){
  const box=document.getElementById("topicChips");
  box.innerHTML=TOPICS.map(([k,l],i)=>`<button class="chip${i===0?" active":""}" data-t="${k}">${l}</button>`).join("");
  box.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{
    box.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));
    c.classList.add("active"); topic=c.dataset.t; render();
  }));
})();
document.getElementById("resetBtn").addEventListener("click",()=>{
  stars=5;streak=0;solved=0;xp=0;badges=[];
  sv(SK.stars,stars);sv(SK.streak,streak);sv(SK.solved,solved);sv(SK.xp,xp);sv(SK.badges,badges);
  updateStats(); render();
});

/* ===== boot ===== */
updateStats();
render();
</script>
</body>
