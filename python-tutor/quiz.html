<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Code Trace — endless Python output puzzles</title>
<style>
  :root{
    --night-0:#0c0d2b; --night-1:#15123f; --night-2:#1d1850;
    --surface:#221c57; --surface-soft:#2a2466; --ink:#090a1c;
    --cream:#f4eddd; --cream-dim:#bdb6d8;
    --saffron:#f2a93b; --saffron-soft:#f6c878;
    --jade:#74d6c3; --lotus:#c9a7f0; --coral:#f0856f;
    --hair:rgba(244,237,221,0.12);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Monaco,"Cascadia Code",Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 700px at 80% -10%, #2a2068 0%, transparent 55%),
      radial-gradient(900px 600px at 0% 110%, #241a5a 0%, transparent 50%),
      linear-gradient(160deg, var(--night-0), var(--night-1) 60%, var(--night-2));
    color:var(--cream); font-family:var(--sans); line-height:1.55; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:700px;margin:0 auto;padding:18px 16px 60px;}
  header.top{text-align:center;margin-bottom:10px;}
  .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--saffron);opacity:.85;}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(26px,8vw,40px);margin:6px 0 4px;}
  h1 .glow{color:var(--saffron-soft);}
  .sub{color:var(--cream-dim);font-size:13.5px;max-width:44ch;margin:0 auto;}

  .nav{display:flex;justify-content:center;gap:7px;margin:12px 0 10px;flex-wrap:wrap;}
  .pill{font-size:12.5px;font-weight:600;border:1px solid var(--hair);background:var(--surface);color:var(--cream-dim);border-radius:999px;padding:7px 13px;cursor:pointer;text-decoration:none;display:inline-block;}
  .pill:hover{color:var(--cream);}
  .pill.active{background:var(--saffron);color:var(--night-0);border-color:var(--saffron);}
  .chips{display:flex;justify-content:center;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .chip{font-size:11.5px;font-weight:600;border:1px solid var(--hair);background:var(--surface-soft);color:var(--cream-dim);border-radius:999px;padding:5px 11px;cursor:pointer;}
  .chip.active{background:rgba(116,214,195,.16);border-color:rgba(116,214,195,.45);color:var(--jade);}

  .rankbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .rankbar .rk{font-family:var(--serif);font-size:14px;color:var(--saffron-soft);white-space:nowrap;}
  .xpbar{flex:1;height:9px;border-radius:999px;background:var(--surface);overflow:hidden;border:1px solid var(--hair);}
  .xpbar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lotus),#9d6fe0);transition:width .35s ease;}
  .rankbar .xp{font-family:var(--mono);font-size:11px;color:var(--cream-dim);white-space:nowrap;}

  .stats{display:flex;gap:9px;justify-content:center;margin-bottom:13px;flex-wrap:wrap;}
  .stat{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:7px 13px;text-align:center;min-width:80px;}
  .stat .n{font-family:var(--serif);font-size:19px;line-height:1;}
  .stat .l{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--cream-dim);margin-top:3px;}
  .stat.stars .n{color:var(--saffron-soft);}
  .stat.streak .n{color:var(--jade);}
  .stat.solved .n{color:var(--lotus);}

  .card{background:linear-gradient(180deg,var(--surface),rgba(29,24,80,.7));border:1px solid var(--hair);border-radius:20px;padding:18px 16px;box-shadow:0 16px 40px -24px rgba(0,0,0,.8);}
  .qrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;gap:8px;}
  .qlabel{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--saffron);}
  .qtopic{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--jade);background:rgba(116,214,195,.1);border:1px solid rgba(116,214,195,.28);border-radius:999px;padding:3px 9px;}
  .qworth{font-family:var(--mono);font-size:11px;color:var(--saffron-soft);}
  .ask{font-size:15px;color:var(--cream);margin:0 0 10px;}
  .ask b{color:var(--saffron-soft);}

  .editor{background:var(--ink);border:1px solid rgba(244,237,221,.10);border-radius:13px;overflow:hidden;}
  .ebar{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid rgba(244,237,221,.07);}
  .ebar .d{width:10px;height:10px;border-radius:50%;}
  .ebar .r{background:#ff6b6b;}.ebar .y{background:#ffce5b;}.ebar .g{background:#74d6c3;}
  .ebar .fn{margin-left:6px;font-family:var(--mono);font-size:11px;color:var(--cream-dim);}
  .code{padding:12px 8px 12px 0;font-family:var(--mono);font-size:13.5px;line-height:1.65;overflow-x:auto;}
  .cl{display:flex;}
  .cl .ln{width:34px;flex:0 0 34px;text-align:right;padding-right:12px;color:#5b5687;user-select:none;}
  .cl .lt{white-space:pre;color:#e9e3ff;}

  .alabel{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cream-dim);margin:15px 0 7px;}
  textarea.ans{width:100%;min-height:58px;resize:vertical;background:var(--ink);border:1px solid var(--hair);border-radius:11px;color:var(--cream);font-family:var(--mono);font-size:14px;line-height:1.6;padding:11px 13px;outline:none;}
  textarea.ans:focus{border-color:var(--saffron);}
  .hintNote{font-size:11px;color:var(--cream-dim);margin-top:5px;}

  .hints{margin-top:12px;}
  .hint-bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
  .hint-bar .htitle{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--cream-dim);margin-right:2px;}
  .hbtn{font-size:12.5px;font-weight:600;border:1px solid rgba(201,167,240,.35);background:rgba(201,167,240,.10);color:var(--lotus);border-radius:999px;padding:6px 11px;cursor:pointer;}
  .hbtn:disabled{opacity:.4;cursor:not-allowed;}
  .hbtn.used{background:rgba(116,214,195,.12);border-color:rgba(116,214,195,.4);color:var(--jade);cursor:default;}
  .hint-out{margin-top:9px;display:flex;flex-direction:column;gap:6px;}
  .hint-card{background:rgba(201,167,240,.08);border:1px solid rgba(201,167,240,.22);border-radius:10px;padding:8px 11px;font-size:13.5px;color:var(--cream);}
  .hint-card b{color:var(--lotus);}
  .hint-card .c{font-family:var(--mono);font-size:12.5px;background:rgba(9,10,28,.6);padding:1px 5px;border-radius:5px;color:var(--jade);}

  .controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  button{font-family:var(--sans);font-size:14.5px;font-weight:600;border:0;border-radius:11px;padding:11px 18px;cursor:pointer;transition:transform .1s ease,filter .15s ease;}
  button:active{transform:translateY(1px);}
  .btn-check{background:linear-gradient(160deg,var(--saffron),#dd8e23);color:var(--night-0);}
  .btn-next{background:linear-gradient(160deg,var(--jade),#48b6a2);color:var(--night-0);}
  .btn-ghost{background:transparent;color:var(--cream-dim);border:1px solid var(--hair);font-weight:500;}

  .fb{margin-top:13px;border-radius:12px;padding:12px 14px;font-size:14.5px;display:none;}
  .fb.show{display:block;}
  .fb.win{background:rgba(116,214,195,.12);border:1px solid rgba(116,214,195,.4);}
  .fb.win b{color:var(--jade);}
  .fb.miss{background:rgba(240,133,111,.10);border:1px solid rgba(240,133,111,.4);}
  .fb.miss b{color:var(--coral);}
  .fb.almost{background:rgba(242,169,59,.10);border:1px solid rgba(242,169,59,.4);}
  .fb.almost b{color:var(--saffron-soft);}
  .fb .real{display:block;margin-top:7px;font-family:var(--mono);font-size:13.5px;background:rgba(9,10,28,.55);border-radius:8px;padding:8px 10px;color:var(--cream);white-space:pre-wrap;}
  .fb .why{margin-top:8px;font-size:13.5px;color:var(--cream-dim);}
  .fb .why b{color:var(--lotus);}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(40px);background:linear-gradient(160deg,#2a2466,#1d1850);border:1px solid rgba(246,200,120,.5);color:var(--cream);border-radius:14px;padding:12px 18px;font-size:14px;font-weight:600;box-shadow:0 18px 40px -16px rgba(0,0,0,.8);opacity:0;transition:opacity .3s ease,transform .3s ease;z-index:60;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast b{color:var(--saffron-soft);}

  .footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:0 4px;}
  .footer small{color:var(--cream-dim);font-size:11.5px;}
  .footer .reset{background:none;border:0;color:var(--cream-dim);font-size:11.5px;text-decoration:underline;cursor:pointer;padding:0;}
  .chip.mode.active{background:rgba(242,169,59,.18);border-color:rgba(242,169,59,.5);color:var(--saffron-soft);}
  .taskbox{background:rgba(201,167,240,.10);border:1px solid rgba(201,167,240,.25);border-radius:12px;padding:11px 13px;font-size:14.5px;color:var(--cream);margin-bottom:10px;}
  .taskbox b{color:var(--lotus);}
  .btn-run{background:var(--surface-soft);color:var(--cream);border:1px solid rgba(116,214,195,.4);}
  .btn-run:hover{filter:brightness(1.15);}
  .output{margin-top:13px;border-radius:12px;border:1px solid var(--hair);background:rgba(9,10,28,.6);padding:12px 14px;font-family:var(--mono);font-size:13.5px;white-space:pre-wrap;word-break:break-word;color:var(--cream);min-height:20px;}
  .output .ph{color:var(--cream-dim);font-style:italic;}
  .output.err{border-color:rgba(240,133,111,.5);background:rgba(240,133,111,.08);color:var(--coral);}
  .wsol{background:rgba(9,10,28,.6);border:1px solid var(--hair);border-radius:8px;padding:8px 10px;margin-top:6px;font-family:var(--mono);font-size:12.5px;color:#d6e2ff;white-space:pre;overflow-x:auto;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="kicker">read code like Python does</div>
    <h1>Code <span class="glow">Trace</span></h1>
    <p class="sub">Real multi-line Python. Predict what it prints. Earn ⭐ &amp; XP, climb the ranks, spend ⭐ on hints.</p>
  </header>

  <div class="nav">
    <a class="pill" href="index.html" style="text-decoration:none;">← Lessons &amp; AI</a>
    <a class="pill" href="learn.html" style="text-decoration:none;">📚 Learn</a>

    <span class="rk" id="rankName">🥚 Hatchling</span>
    <div class="xpbar"><i id="xpFill"></i></div>

  <div class="stats">
    <div class="stat stars"><div class="n" id="stStars">5</div><div class="l">stars</div></div>

  <main class="card" id="card"></main>

  <div class="footer">
    <small>Type the output exactly, line by line.</small>
    <button class="reset" id="resetBtn">Reset progress</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   mini-py — a tiny Python interpreter (pure JS). Used here to
   COMPUTE the correct output of every generated program, so the
   game's answers are always right. Cross-checked against real
   CPython during development. Supports: print, variables,
   f-strings, + - * // % **, augmented assignment (+= -= *= //= %= **=),
   comparisons, and/or/not, in, lists, tuples & unpacking, indexing,
   slicing, item assignment, break/continue/pass, dicts, range, for,
   while, if/elif/else, break/continue/pass, def/return (defaults),
   try/except/else/finally + raise, not in / is / is not, list/set/dict
   comprehensions, sets, and many builtins (len, sum, min, max, abs,
   round, sorted, reversed, zip, enumerate, any, all, list, tuple, set,
   bool) plus string methods (upper, lower, title, split, join, replace,
   strip, startswith, find, ...) and list methods (append, pop, sort,
   reverse, insert, index, extend, remove).
   (Numbers are unified — no separate float type — so it avoids true
   division / and float-precision cases like round(x, n). Set iteration
   order is insertion order, so generated content prints sorted(set) not
   raw sets.)
   ============================================================ */
function pyError(msg){const e=new Error(msg);e.__pyerr=true;return e;}
function toLogicalLines(src){
  const phys=src.replace(/\r\n/g,"\n").replace(/\t/g,"    ").split("\n");
  const res=[]; let i=0;
  while(i<phys.length){
    let raw=phys[i]; const indent=raw.length-raw.trimStart().length;
    let {text,depth,open}=scanLine(raw); let buf=text;
    while(open && i+1<phys.length){ i++; const nxt=scanLine(phys[i]); buf+=" "+nxt.text.trim(); open=nxt.openFrom(depth); depth=nxt.depthFrom(depth); }
    if(buf.trim().length>0) res.push({indent,text:buf}); i++;
  }
  return res;
}
function scanLine(line){
  let s="",depth=0,inStr=false,q="",esc=false;
  for(let k=0;k<line.length;k++){ const c=line[k];
    if(inStr){ s+=c; if(esc){esc=false;} else if(c==="\\"){esc=true;} else if(c===q){inStr=false;} continue; }
    if(c==="'"||c==='"'){inStr=true;q=c;s+=c;continue;}
    if(c==="#"){break;}
    if(c==="("||c==="["||c==="{")depth++;
    if(c===")"||c==="]"||c==="}")depth--;
    s+=c;
  }
  return {text:s,depth,open:depth>0,openFrom:(d)=>(d+depth)>0,depthFrom:(d)=>d+depth};
}
function parseBlock(lines,st,parentIndent){
  const body=[]; if(st.i>=lines.length) return body;
  const indent=lines[st.i].indent; if(indent<=parentIndent) return body;
  while(st.i<lines.length && lines[st.i].indent===indent){ body.push(parseStatement(lines,st,indent)); }
  return body;
}
function parseStatement(lines,st,indent){
  const text=lines[st.i].text.trim(); let m;
  if((m=/^if\s+(.*):$/.exec(text))){
    st.i++; const cond=parseExpr(m[1]); const branches=[{cond,body:parseBlock(lines,st,indent)}]; let els=null;
    while(st.i<lines.length && lines[st.i].indent===indent){ const t=lines[st.i].text.trim(); let em;
      if((em=/^elif\s+(.*):$/.exec(t))){ st.i++; branches.push({cond:parseExpr(em[1]),body:parseBlock(lines,st,indent)}); }
      else if(/^else\s*:$/.test(t)){ st.i++; els=parseBlock(lines,st,indent); break; } else break; }
    return {t:"if",branches,els};
  }
  if((m=/^for\s+(.*?)\s+in\s+(.*):$/.exec(text))){ st.i++; const targets=m[1].split(",").map(s=>s.trim()); const iter=parseExpr(m[2]); return {t:"for",targets,iter,body:parseBlock(lines,st,indent)}; }
  if((m=/^while\s+(.*):$/.exec(text))){ st.i++; return {t:"while",cond:parseExpr(m[1]),body:parseBlock(lines,st,indent)}; }
  if(/^try\s*:$/.test(text)){ st.i++; const body=parseBlock(lines,st,indent); const handlers=[]; let els=null,fin=null;
    while(st.i<lines.length && lines[st.i].indent===indent){ const t=lines[st.i].text.trim(); let em;
      if((em=/^except\b(.*):$/.exec(t))){ st.i++; const spec=em[1].trim(); let type=null,vname=null;
        if(spec){ const am=/^([A-Za-z_]\w*)(?:\s+as\s+([A-Za-z_]\w*))?$/.exec(spec); if(am){type=am[1];vname=am[2]||null;} }
        handlers.push({type,vname,body:parseBlock(lines,st,indent)}); }
      else if(/^else\s*:$/.test(t)){ st.i++; els=parseBlock(lines,st,indent); }
      else if(/^finally\s*:$/.test(t)){ st.i++; fin=parseBlock(lines,st,indent); break; }
      else break; }
    return {t:"try",body,handlers,els,fin}; }
  if((m=/^def\s+([A-Za-z_]\w*)\s*\((.*)\)\s*:$/.exec(text))){ st.i++; return {t:"def",name:m[1],params:parseParams(m[2]),body:parseBlock(lines,st,indent)}; }
  if((m=/^return\b(.*)$/.exec(text))){ st.i++; const ex=m[1].trim(); return {t:"return",expr:ex?parseExpr(ex):{t:"none"}}; }
  if(/^break$/.test(text)){ st.i++; return {t:"break"}; }
  if(/^continue$/.test(text)){ st.i++; return {t:"continue"}; }
  if(/^pass$/.test(text)){ st.i++; return {t:"pass"}; }
  if((m=/^raise\b(.*)$/.exec(text))){ st.i++; return {t:"raise",arg:m[1].trim()}; }
  st.i++;
  const aug=findAug(text);
  if(aug){ return {t:"assign",target:text.slice(0,aug.start).trim(),op:aug.op,expr:parseExpr(text.slice(aug.eqPos+1).trim())}; }
  const eq=findTopAssign(text);
  if(eq>=0){ return {t:"assign",target:text.slice(0,eq).trim(),op:null,expr:parseExpr(text.slice(eq+1).trim())}; }
  return {t:"expr",expr:parseExpr(text)};
}
function parseParams(s){ s=s.trim(); if(!s) return []; return splitTop(s,",").map(p=>{ const e=findTopAssign(p); if(e>=0) return {name:p.slice(0,e).trim(),def:parseExpr(p.slice(e+1).trim())}; return {name:p.trim(),def:null}; }); }
function splitTop(s,sep){ const parts=[]; let depth=0,inStr=false,q="",esc=false,cur=""; for(let k=0;k<s.length;k++){ const c=s[k];
  if(inStr){ cur+=c; if(esc)esc=false; else if(c==="\\")esc=true; else if(c===q)inStr=false; continue; }
  if(c==="'"||c==='"'){inStr=true;q=c;cur+=c;continue;}
  if(c==="("||c==="["||c==="{"){depth++;cur+=c;continue;}
  if(c===")"||c==="]"||c==="}"){depth--;cur+=c;continue;}
  if(c===sep&&depth===0){parts.push(cur);cur="";continue;} cur+=c; }
  if(cur.trim().length) parts.push(cur); return parts; }
function findTopAssign(text){ let depth=0,inStr=false,q="",esc=false; for(let k=0;k<text.length;k++){ const c=text[k];
  if(inStr){ if(esc)esc=false; else if(c==="\\")esc=true; else if(c===q)inStr=false; continue; }
  if(c==="'"||c==='"'){inStr=true;q=c;continue;}
  if(c==="("||c==="["||c==="{")depth++; else if(c===")"||c==="]"||c==="}")depth--;
  else if(c==="="&&depth===0){ const prev=text[k-1],next=text[k+1]; if(next==="="){k++;continue;} if(prev==="="||prev==="!"||prev===">"||prev==="<")continue; return k; } }
  return -1; }
/* Detect augmented assignment (+= -= *= /= //= %= **=) at top level, string-aware. */
function findAug(text){ let depth=0,inStr=false,q="",esc=false;
  for(let k=0;k<text.length;k++){ const c=text[k];
    if(inStr){ if(esc)esc=false; else if(c==="\\")esc=true; else if(c===q)inStr=false; continue; }
    if(c==="'"||c==='"'){inStr=true;q=c;continue;}
    if(c==="("||c==="["||c==="{"){depth++;continue;}
    if(c===")"||c==="]"||c==="}"){depth--;continue;}
    if(depth===0&&"+-*/%".includes(c)){ let e=k; while(e+1<text.length&&"+-*/%".includes(text[e+1]))e++;
      if(text[e+1]==="="&&text[e+2]!=="="){ return {start:k, eqPos:e+1, op:text.slice(k,e+1)}; } k=e; } }
  return null; }
function tokenize(s){ const toks=[]; let k=0; const isId=c=>/[A-Za-z_]/.test(c),isIdc=c=>/[A-Za-z0-9_]/.test(c),isD=c=>/[0-9]/.test(c);
  while(k<s.length){ const c=s[k];

function rankFor(xp){ let r=RANKS[0],nxt=null; for(let i=0;i<RANKS.length;i++){ if(xp>=RANKS[i][0]){r=RANKS[i];nxt=RANKS[i+1]||null;} } return {name:r[1],base:r[0],next:nxt}; }

const TOPIC_KEYS=["basics","strings","loops","conditionals","functions","lists","dicts","tuples","methods","builtins","comprehensions","sets","errors"];
const SRS_INT=[0,1,3,8,20,50];
function levelFromBox(box){ return box<=2?1:(box<=4?2:3); }
function recordReview(t,success){ if(reviewed) return; reviewed=true; clock++; sv(SK.clock,clock);
  const s=srs[t]||{box:1,seen:0,at:0}; s.box=success?Math.min(5,s.box+1):1; s.seen=(s.seen||0)+1; s.at=clock; srs[t]=s; sv(SK.srs,srs); updateWeak(); }
function pickDueTopic(){ let due=[],rest=[]; for(const t of TOPIC_KEYS){ const s=srs[t]; if(!s){ rest.push({t,box:99,d:Infinity}); continue; } const d=s.at+SRS_INT[s.box]; (d<=clock?due:rest).push({t,box:s.box,d}); } const pool=due.length?due:rest; pool.sort((a,b)=>a.box-b.box||a.d-b.d); return pool[0].t; }
function updateWeak(){ const el=document.getElementById("weakspots"); if(!el) return; const seen=Object.keys(srs);
  if(!seen.length){ el.textContent="🩹 Review mode focuses on the topics you miss most."; return; }
  const weak=seen.filter(t=>srs[t].box<=2).sort((a,b)=>srs[a].box-srs[b].box).slice(0,3);
  el.innerHTML = weak.length ? ("Needs review: "+weak.map(t=>`<span style='color:var(--coral)'>${t}</span>`).join(", ")) : "<span style='color:var(--jade)'>All topics looking solid! 🎉</span>"; }

/* ===== question generation (output computed by runPy) ===== */
function poolFor(){
  const t = forceTopic || topic;
  const lvls = forceLevel ? [forceLevel] : (mode==="mix"?[1,2,3,4]:[{easy:1,medium:2,hard:3,expert:4}[mode]]);
  let items=[];
  for(const lv of lvls) for(const it of GEN[lv]) if(t==="all"||it.topic===t) items.push({lv,it});
  if(!items.length){ for(const lv of lvls) for(const it of GEN[lv]) items.push({lv,it}); } // relax topic
  if(!items.length){ for(const lv of [1,2,3,4]) for(const it of GEN[lv]) items.push({lv,it}); }
  return items;
}
function newQuestion(){
  const pool=poolFor();
  for(let tries=0;tries<25;tries++){
    const {lv,it}=pick(pool);
    const q=it.gen();
    const res=runPy(q.code);
    if(!res.err && res.out.trim().length){ q.out=res.out.replace(/\n$/,""); q.level=lv; q.topic=it.topic; return q; }
  }
  // ultra-safe fallback
  const a=ri(2,9),b=ri(2,9);
  return {code:`a = ${a}\nb = ${b}\nprint(a + b)`,out:String(a+b),level:1,topic:"basics",concept:"variables and +",why:`${a}+${b}=${a+b}.`};
}

/* ===== hints ===== */
function shapeHint(out){
  if(out.includes("\n")) return `It prints <b>${out.split("\n").length} lines</b>.`;
  if(out==="True"||out==="False") return `The answer is just <b>True</b> or <b>False</b>.`;
  if(/^-?\d+$/.test(out)) return `The output is <b>one whole number</b>.`;
  if(out.startsWith("[")) return `The output is a <b>list</b> like <span class="c">[ ... ]</span>.`;
  if(out.startsWith("{")) return `The output is a <b>dictionary</b> like <span class="c">{ ... }</span>.`;
  return `The output is <b>text</b> (${out.length} characters).`;
}
function revealHint(out){
  if(out.includes("\n")){ return `The first line is: <span class="c">${esc(out.split("\n")[0])}</span>`; }
  if(out.length<=2) return `It starts with <span class="c">${esc(out[0])}</span> (very short).`;
  return `It starts with <span class="c">${esc(out.slice(0,Math.max(1,Math.ceil(out.length/3))))}</span>…`;
}
const HINTS=[
 {cost:1,label:"Concept",make:q=>`<b>Concept:</b> ${q.concept}.`},
 {cost:2,label:"Shape",make:q=>`<b>Shape:</b> ${shapeHint(q.out)}`},
 {cost:3,label:"Reveal start",make:q=>`<b>Reveal:</b> ${revealHint(q.out)}`},
];
function renderHintBar(){
  const bar=document.getElementById("hintBar"); if(!bar) return;
  bar.querySelectorAll(".hbtn").forEach((btn,i)=>{ const h=HINTS[i];
    if(bought.includes(i)){ btn.classList.add("used"); btn.disabled=true; btn.textContent=h.label+" ✓"; }
    else { btn.disabled = solvedThis || stars<h.cost; btn.textContent=`${h.label} (${h.cost}⭐)`; } });
}
function buyHint(i){
  if(solvedThis||bought.includes(i)) return; const h=HINTS[i]; if(stars<h.cost) return;
  stars-=h.cost; sv(SK.stars,stars); bought.push(i); updateStats();
  const div=document.createElement("div"); div.className="hint-card"; div.innerHTML=h.make(cur);
  document.getElementById("hintOut").appendChild(div); renderHintBar();
}

/* ===== rendering ===== */
function codeHtml(code){ return code.split("\n").map((ln,i)=>`<div class="cl"><span class="ln">${i+1}</span><span class="lt">${esc(ln)||" "}</span></div>`).join(""); }
const LVLNAME=["","Easy","Medium","Hard","Expert"];
function worth(lv){ return "⭐".repeat(lv)+` · +${lv*10} XP`; }
function renderPredict(){
  attempts=0; solvedThis=false; bought=[]; cur=newQuestion(); updateStats();
  document.getElementById("card").innerHTML=`
    <div class="qrow">
      <span class="qlabel">${LVLNAME[cur.level]} · trace it</span>

    </div>
    <div class="ask">What does this program <b>print</b>? <span style="color:var(--saffron-soft);font-size:12px;">(worth ${worth(cur.level)})</span></div>

  const ans=document.getElementById("ans"); ans.focus();
  ans.addEventListener("keydown",e=>{ if((e.ctrlKey||e.metaKey)&&e.key==="Enter") check(); });
  document.getElementById("checkBtn").addEventListener("click",check);
  document.getElementById("giveBtn").addEventListener("click",giveUp);
  document.getElementById("skipBtn").addEventListener("click",next);
  document.querySelectorAll("#hintBar .hbtn").forEach(b=>b.addEventListener("click",()=>buyHint(parseInt(b.dataset.h,10))));

}
function realBlock(){ return `<span class="real">${esc(cur.out)}</span>`
  +`<div class="why"><b>Step by step:</b> ${cur.why}</div>`
  +`<div class="why" style="margin-top:5px;"><b>The idea:</b> ${cur.concept}.</div>`
  +`<div class="why" style="margin-top:6px;"><a href="visualize.html#${encodeURIComponent(cur.code)}" target="_blank" rel="noopener" style="color:var(--jade);font-weight:600;">🔎 Watch this run line by line →</a></div>`; }
function showFb(kind,html){ const fb=document.getElementById("fb"); fb.className="fb "+kind+" show"; fb.innerHTML=html; }
function lockSolved(){
  solvedThis=true;
  document.getElementById("checkBtn").style.display="none";
  document.getElementById("giveBtn").style.display="none";
  const skip=document.getElementById("skipBtn"); skip.textContent="Next →"; skip.className="btn-next";
  renderHintBar();
}

function check(){
  if(solvedThis) return;
  const user=norm(document.getElementById("ans").value);
  const expect=norm(cur.out);
  if(user===expect){
    const firstTry = attempts===0 && bought.length===0;
    const sReward=cur.level, xReward=cur.level*10;
    stars+=sReward; xp+=xReward; solved++;
    if(firstTry) streak++;
    sv(SK.stars,stars); sv(SK.xp,xp); sv(SK.solved,solved); sv(SK.streak,streak);
    updateStats();
    let extra = firstTry?` <b>+${sReward}⭐ · +${xReward} XP</b>` : ` +${sReward}⭐ · +${xReward} XP (you got there — that counts!)`;
    let sb = (firstTry && streak>0 && streak%5===0)?` 🔥 ${streak} streak!`:"";
    showFb("win","<b>✓ Correct!</b>"+extra+sb+realBlock());
    lockSolved(); checkBadges(cur.level); recordReview(cur.topic,true);
    return;
  }
  // wrong — explain why, then let them retry (full walkthrough after the 2nd miss)
  attempts++; streak=0; sv(SK.streak,streak); updateStats();
  const caseOnly = user.length && user.toLowerCase()===expect.toLowerCase();
  let nudge;
  if(!user) nudge="Type what the program prints — one line for each thing it prints.";
  else if(caseOnly) nudge="Right letters, but Python is <b>case-sensitive</b> — check your capitals (e.g. <span class='c'>True</span>, not <span class='c'>true</span>).";
  else if(user.split("\n").length!==expect.split("\n").length) nudge=`Your answer has <b>${user.split("\n").length} line(s)</b>, but this program prints <b>${expect.split("\n").length} line(s)</b>. Count the <span class='c'>print()</span>s — and how many times each loop repeats.`;
  else nudge="Right number of lines — but a value is off. Re-check the arithmetic, or which branch the <span class='c'>if</span> takes.";
  if(attempts>=2){
    showFb("miss","<b>Let's walk through it together.</b> "+nudge+realBlock());
    lockSolved(); recordReview(cur.topic,false);
  } else {
    showFb(caseOnly?"almost":"miss","<b>Not quite — try again.</b> "+nudge
      +`<div class="why" style="margin-top:6px;"><b>The idea:</b> ${cur.concept}. <span style="color:var(--cream-dim)">(Try once more — your answer stays. A hint reveals the shape or the start; the full walkthrough shows after another try.)</span></div>`);
  }
}
function giveUp(){
  if(solvedThis) return;
  streak=0; sv(SK.streak,streak); updateStats();
  showFb("almost","<b>Here's the answer:</b>"+realBlock());
  lockSolved(); recordReview(cur.topic,false);
}
function next(){ qIndex++; render(); }

  {topic:"functions",gen:()=>({prompt:`Write a function <b>add(a, b)</b> that <b>returns</b> a + b. (It will be tested with a few values.)`,starter:`def add(a, b):\n    `,kind:"func",tests:`print(add(2, 3))\nprint(add(10, 20))`,expectedTests:"5\n30",need:["def","return"],solution:`def add(a, b):\n    return a + b`,concept:"a function hands back a value with 'return'",why:`add(2, 3) → 5 and add(10, 20) → 30.`})},
  {topic:"builtins",gen:()=>{const arr=pickn([7,2,9,4,1,8,5],4);return{prompt:`The list <b>nums = [${arr.join(", ")}]</b> is given. Print them <b>sorted</b> (smallest first).`,starter:`nums = [${arr.join(", ")}]\n`,kind:"output",expected:pyList(arr.slice().sort((x,y)=>x-y)),need:["sorted"],solution:`nums = [${arr.join(", ")}]\nprint(sorted(nums))`,concept:"sorted() returns an ordered copy",why:`In order: ${pyList(arr.slice().sort((x,y)=>x-y))}.`};}},
  {topic:"methods",gen:()=>{const arr=pickn(WORDS,3);return{prompt:`Join the list <b>words = [${arr.map(x=>`"${x}"`).join(", ")}]</b> into one string with <b>"-"</b> between the words, and print it.`,starter:`words = [${arr.map(x=>`"${x}"`).join(", ")}]\n`,kind:"output",expected:arr.join("-"),need:[".join("],solution:`words = [${arr.map(x=>`"${x}"`).join(", ")}]\nprint("-".join(words))`,concept:'"sep".join(list) glues text together',why:`Result: "${arr.join("-")}".`};}},
  {topic:"loops",gen:()=>{const k=ri(3,5);const exp=Array.from({length:k},(_,i)=>i).join("\n");return{prompt:`Print <b>0 up to ${k-1}</b>, then <b>stop</b> before ${k} using <b>break</b>. (Loop over range(10).)`,starter:`for i in range(10):\n    `,kind:"output",expected:exp,need:["break"],solution:`for i in range(10):\n    if i == ${k}:\n        break\n    print(i)`,concept:"break leaves the loop early",why:`It prints 0..${k-1}, then break stops the loop before ${k}.`};}},
  {topic:"comprehensions",gen:()=>({prompt:`Use a <b>list comprehension</b> to print the squares of <b>1, 2, 3, 4, 5</b>. (Expected: [1, 4, 9, 16, 25])`,starter:``,kind:"output",expected:"[1, 4, 9, 16, 25]",need:["for"],solution:`print([x * x for x in range(1, 6)])`,concept:"a comprehension builds a list in one line",why:`x*x for x in 1..5 gives 1, 4, 9, 16, 25.`})},
  {topic:"sets",gen:()=>({prompt:`The list <b>nums = [1, 2, 2, 3, 3, 3]</b> is given. Print how many <b>unique</b> values it has using <b>set()</b>. (Expected: 3)`,starter:`nums = [1, 2, 2, 3, 3, 3]\n`,kind:"output",expected:"3",need:["set("],solution:`nums = [1, 2, 2, 3, 3, 3]\nprint(len(set(nums)))`,concept:"a set drops duplicates",why:`The unique values are 1, 2, 3 → 3 of them.`})},
 ],
 3:[
  {topic:"functions",gen:()=>({prompt:`Write a function <b>double(n)</b> that returns <b>n times 2</b>.`,starter:`def double(n):\n    `,kind:"func",tests:`print(double(4))\nprint(double(25))`,expectedTests:"8\n50",need:["def","return"],solution:`def double(n):\n    return n * 2`,concept:"a function transforms its input and returns it",why:`double(4) → 8, double(25) → 50.`})},
  {topic:"functions",gen:()=>({prompt:`Write a function <b>greet(name)</b> that returns <b>"Hi " + name</b>.`,starter:`def greet(name):\n    `,kind:"func",tests:`print(greet("Sam"))\nprint(greet("Ada"))`,expectedTests:"Hi Sam\nHi Ada",need:["def","return"],solution:`def greet(name):\n    return "Hi " + name`,concept:"join strings with +",why:`greet("Sam") → "Hi Sam".`})},
  {topic:"loops",gen:()=>({prompt:`Print the numbers <b>5 down to 1</b> (a countdown), each on its own line.`,starter:``,kind:"output",expected:"5\n4\n3\n2\n1",solution:`for i in range(5, 0, -1):\n    print(i)`,concept:"range can count down with a negative step",why:`range(5, 0, -1) → 5, 4, 3, 2, 1.`})},

  {topic:"functions",gen:()=>({prompt:`Write a function <b>is_even(n)</b> that returns <b>True</b> if n is even, otherwise <b>False</b>.`,starter:`def is_even(n):\n    `,kind:"func",tests:`print(is_even(4))\nprint(is_even(7))`,expectedTests:"True\nFalse",need:["def","return"],solution:`def is_even(n):\n    return n % 2 == 0`,concept:"you can return a comparison (it's True or False)",why:`4 is even → True, 7 is odd → False.`})},
  {topic:"tuples",gen:()=>({prompt:`Write a function <b>swap(a, b)</b> that <b>returns them reversed</b>, as (b, a).`,starter:`def swap(a, b):\n    `,kind:"func",tests:`print(swap(1, 2))\nprint(swap("x", "y"))`,expectedTests:`(2, 1)\n('y', 'x')`,need:["def","return"],solution:`def swap(a, b):\n    return b, a`,concept:"a function can return several values as a tuple",why:`swap(1, 2) → (2, 1) and swap("x", "y") → ('y', 'x').`})},
  {topic:"builtins",gen:()=>{const a=pickn([1,2,3,4,5],3),b=pickn([10,20,30,40],3);const exp=a.map((x,i)=>`${x} ${b[i]}`).join("\n");return{prompt:`Two lists <b>a = [${a.join(", ")}]</b> and <b>b = [${b.join(", ")}]</b> are given. Use <b>zip</b> to print each pair as "<b>x y</b>" on its own line.`,starter:`a = [${a.join(", ")}]\nb = [${b.join(", ")}]\n`,kind:"output",expected:exp,need:["zip"],solution:`a = [${a.join(", ")}]\nb = [${b.join(", ")}]\nfor x, y in zip(a, b):\n    print(x, y)`,concept:"zip pairs two lists item by item",why:`Each pair prints on its own line: ${a.map((x,i)=>`${x} ${b[i]}`).join(", ")}.`};}},

  {topic:"comprehensions",gen:()=>({prompt:`Given <b>nums = [1, 2, 3, 4, 5, 6]</b>, use a <b>comprehension with if</b> to print only the <b>even</b> numbers. (Expected: [2, 4, 6])`,starter:`nums = [1, 2, 3, 4, 5, 6]\n`,kind:"output",expected:"[2, 4, 6]",need:["for","if"],solution:`nums = [1, 2, 3, 4, 5, 6]\nprint([n for n in nums if n % 2 == 0])`,concept:"add 'if' to a comprehension to filter",why:`It keeps only n where n % 2 == 0.`})},

const WHINTS=[
 {cost:1,label:"Concept",make:c=>`<b>Concept:</b> ${c.concept}.`},
 {cost:2,label:"Approach",make:c=>`<b>Approach:</b> Build it line by line and press Run to test as you go. Key idea: ${c.concept}.`},
 {cost:3,label:"Show solution",make:c=>`<b>One solution:</b><div class="wsol">${esc(c.solution)}</div>`},
];
function award(level, firstTry){ stars+=level; xp+=level*10; solved++; if(firstTry) streak++; sv(SK.stars,stars); sv(SK.xp,xp); sv(SK.solved,solved); sv(SK.streak,streak); updateStats(); }
function writePoolFor(){ const t=forceTopic||topic; const lvls = forceLevel ? [Math.min(3,forceLevel)] : (mode==="mix"?[1,2,3]:[{easy:1,medium:2,hard:3,expert:3}[mode]]); let items=[]; for(const lv of lvls) for(const it of WGEN[lv]) if(t==="all"||it.topic===t) items.push({lv,it}); if(!items.length){ for(const lv of lvls) for(const it of WGEN[lv]) items.push({lv,it}); } if(!items.length){ for(const lv of [1,2,3]) for(const it of WGEN[lv]) items.push({lv,it}); } return items; }
function newWrite(){ const pool=writePoolFor(); const {lv,it}=pick(pool); const c=it.gen(); c.level=lv; c.topic=it.topic; return c; }
function renderHintBarW(){ const bar=document.getElementById("hintBar"); if(!bar) return; bar.querySelectorAll(".hbtn").forEach((btn,i)=>{ const h=WHINTS[i]; if(bought.includes(i)){ btn.classList.add("used"); btn.disabled=true; btn.textContent=h.label+" ✓"; } else { btn.disabled=solvedThis||stars<h.cost; btn.textContent=`${h.label} (${h.cost}⭐)`; } }); }
function buyHintW(i){ if(solvedThis||bought.includes(i)) return; const h=WHINTS[i]; if(stars<h.cost) return; stars-=h.cost; sv(SK.stars,stars); bought.push(i); updateStats(); const div=document.createElement("div"); div.className="hint-card"; div.innerHTML=h.make(curW); document.getElementById("hintOut").appendChild(div); renderHintBarW(); }
function renderWrite(){
  curW=newWrite(); updateStats();
  document.getElementById("card").innerHTML=`
    <div class="qrow">
      <span class="qlabel">✍️ Write · ${LVLNAME[curW.level]}</span>
      <span class="qtopic">${curW.topic}</span>
    </div>
    <div class="taskbox"><b>Task:</b> ${curW.prompt} <span style="color:var(--saffron-soft);font-size:12px;">(worth ${worth(curW.level)})</span></div>
    <div class="editor">
      <div class="ebar"><span class="d r"></span><span class="d y"></span><span class="d g"></span><span class="fn">solution.py</span></div>
      <textarea class="ans" id="wcode" spellcheck="false" style="min-height:120px;">${esc(curW.starter||"")}</textarea>
    </div>
    <div class="controls">
      <button class="btn-run" id="wrun">▶ Run</button>
      <button class="btn-check" id="wsubmit">Submit ✓</button>
      <button class="btn-ghost" id="wgive">Show answer</button>
      <button class="btn-ghost" id="wskip">Skip →</button>
    </div>
    <div class="output" id="wout"><span class="ph">Press Run to test your code…</span></div>
    <div class="hints">
      <div class="hint-bar" id="hintBar">
        <span class="htitle">Stuck? Hints:</span>
        <button class="hbtn" data-h="0"></button>
        <button class="hbtn" data-h="1"></button>
        <button class="hbtn" data-h="2"></button>
      </div>
      <div class="hint-out" id="hintOut"></div>
    </div>
    <div class="fb" id="fb"></div>`;
  const ta=document.getElementById("wcode"); ta.focus();
  ta.addEventListener("keydown",e=>{ if(e.key==="Tab"){e.preventDefault();const s=ta.selectionStart,en=ta.selectionEnd;ta.value=ta.value.slice(0,s)+"    "+ta.value.slice(en);ta.selectionStart=ta.selectionEnd=s+4;} if((e.ctrlKey||e.metaKey)&&e.key==="Enter") wsubmit(); });
  document.getElementById("wrun").addEventListener("click",wrun);
  document.getElementById("wsubmit").addEventListener("click",wsubmit);
  document.getElementById("wgive").addEventListener("click",wgive);
  document.getElementById("wskip").addEventListener("click",next);
  document.querySelectorAll("#hintBar .hbtn").forEach(b=>b.addEventListener("click",()=>buyHintW(parseInt(b.dataset.h,10))));
  renderHintBarW();
}
function friendlyError(raw){
  const m=String(raw); let plain="Something's off in the code.";
  if(/NameError/.test(m)){ const n=(m.match(/name '([^']+)'/)||[])[1]; plain=`Python doesn't recognise <span class='c'>${esc(n||"that name")}</span>. Usually a typo, a missing quote (text needs quotes like <span class='c'>"hi"</span>), or using it before you created it.`; }
  else if(/SyntaxError/.test(m)) plain=`There's a typo in the structure — most often a missing <span class='c'>:</span> at the end of an if/for/while/def line, or a missing <span class='c'>)</span> or quote.`;
  else if(/IndexError/.test(m)) plain=`You asked for a list or string position that doesn't exist. Counting starts at <span class='c'>0</span>, so a list of 3 has positions 0, 1, 2.`;
  else if(/KeyError/.test(m)) plain=`That key isn't in the dictionary. Check the spelling, or use <span class='c'>.get(key)</span>.`;
  else if(/str \+ non-str|cannot add string/.test(m)) plain=`You tried to join text and a number with <span class='c'>+</span>. Turn the number into text with <span class='c'>str(...)</span>, or use an f-string: <span class='c'>f"n={n}"</span>.`;
  else if(/not callable/.test(m)) plain=`You tried to "call" something that isn't a function — often an extra pair of <span class='c'>()</span>.`;
  else if(/missing arg/.test(m)) plain=`Your function was called with too few values — give it every input it asks for.`;
  else if(/AttributeError/.test(m)) plain=`That action doesn't exist for this kind of value. For example <span class='c'>.append()</span> is for lists and <span class='c'>.upper()</span> is for text.`;
  else if(/loop too long|RuntimeError/.test(m)) plain=`Your loop never stops — make sure something changes inside it so the condition becomes False.`;
  else if(/cannot unpack|ValueError/.test(m)) plain=`The number of variables doesn't match the data — e.g. <span class='c'>for a, b in ...</span> needs each item to have two parts.`;
  else if(/not iterable/.test(m)) plain=`You tried to loop over something that isn't a sequence (like a plain number). Loop over a list, string, or range.`;
  else if(/not indexable|not sliceable/.test(m)) plain=`You used <span class='c'>[ ]</span> on something that doesn't support it (like a number).`;
  return `<b>What went wrong:</b> ${plain}<br><span style="color:var(--cream-dim);font-size:11.5px;">Python's words: ${esc(m)}</span>`;
}
function wrun(){ const res=runPy(document.getElementById("wcode").value); const o=document.getElementById("wout");
  if(res.err){ o.className="output err"; o.innerHTML=friendlyError(res.err); }
  else { o.className="output"; o.textContent=res.out.trim().length?res.out:"(your code ran, but nothing was printed)"; } }
function checkWrite(code){
  const res=runPy(code);
  if(res.err) return {ok:false,err:res.err};
  if(curW.need){ for(const s of curW.need){ if(!code.includes(s)) return {ok:false,msg:`Make sure your code uses <span class='c'>${esc(s)}</span>.`}; } }
  if(curW.kind==="output"){ return {ok:norm(res.out)===norm(curW.expected),got:res.out}; }
  const full=runPy(code+"\n"+curW.tests);
  if(full.err) return {ok:false,err:full.err};
  let testOut=full.out; if(testOut.startsWith(res.out)) testOut=testOut.slice(res.out.length);
  return {ok:norm(testOut)===norm(curW.expectedTests),got:testOut};
}
function lockWrite(){ solvedThis=true; ["wsubmit","wgive","wrun"].forEach(id=>{const el=document.getElementById(id); if(el) el.style.display="none";}); const skip=document.getElementById("wskip"); skip.textContent="Next →"; skip.className="btn-next"; renderHintBarW(); }
function wsubmit(){
  if(solvedThis) return;
  const code=document.getElementById("wcode").value; const r=checkWrite(code);
  if(r.ok){
    const firstTry=attempts===0 && bought.length===0; award(curW.level,firstTry);
    const extra=firstTry?` <b>+${curW.level}⭐ · +${curW.level*10} XP</b>`:` +${curW.level}⭐ · +${curW.level*10} XP (you got it working!)`;
    const sb=(firstTry && streak>0 && streak%5===0)?` 🔥 ${streak} streak!`:"";
    showFb("win","<b>✓ Your code works!</b>"+extra+sb
      +`<div class="why" style="margin-top:7px;"><b>Why it works:</b> ${curW.why}</div>`
      +`<div class="why" style="margin-top:5px;"><b>A clean solution:</b></div><div class="wsol">${esc(curW.solution)}</div>`);
    lockWrite(); checkBadges(curW.level); recordReview(curW.topic,true);
    return;
  }
  attempts++; streak=0; sv(SK.streak,streak); updateStats();
  let msg;
  if(r.err) msg=friendlyError(r.err)+`<br>Fix it and Submit again.`;
  else if(r.msg) msg=r.msg;
  else msg=`Not matching yet. Your output:<div class="wsol">${esc((r.got||"").replace(/\n$/,"").trim()||"(nothing printed)")}</div>Expected:<div class="wsol">${esc(curW.kind==="output"?curW.expected:curW.expectedTests)}</div>`;
  if(attempts>=3){ showFb("miss","<b>Here's one way to do it.</b> "+msg+`<div class="why" style="margin-top:7px;"><b>Solution:</b></div><div class="wsol">${esc(curW.solution)}</div><div class="why" style="margin-top:5px;">${curW.why}</div>`); lockWrite(); recordReview(curW.topic,false); }
  else showFb("miss","<b>Almost — try again.</b> "+msg+`<div class="why" style="margin-top:6px;"><b>Idea:</b> ${curW.concept}. <span style="color:var(--cream-dim)">(Press Run to see your output; a hint can show the approach or a full solution.)</span></div>`);
}
function wgive(){ if(solvedThis) return; streak=0; sv(SK.streak,streak); updateStats(); showFb("almost","<b>Here's a working solution:</b><div class=\"wsol\">"+esc(curW.solution)+"</div><div class=\"why\" style=\"margin-top:6px;\">"+curW.why+"</div>"); lockWrite(); recordReview(curW.topic,false); }

/* ===== dispatcher: predict or write (alternating) ===== */
function render(){
  attempts=0; solvedThis=false; bought=[]; reviewed=false; forceTopic=null; forceLevel=null;
  if(gameMode==="review"){ const t=pickDueTopic(); forceTopic=t; const s=srs[t]; forceLevel=levelFromBox(s?s.box:1); }
  const isWrite = gameMode==="write" || ((gameMode==="alt"||gameMode==="review") && qIndex%2===1);
  if(isWrite) renderWrite(); else renderPredict();
}
(function buildMode(){
  const row=document.getElementById("modeRow"); if(!row) return;
  row.querySelectorAll(".chip.mode").forEach(c=>{
    c.classList.toggle("active", c.dataset.gm===gameMode);
    c.addEventListener("click",()=>{ row.querySelectorAll(".chip.mode").forEach(x=>x.classList.remove("active")); c.classList.add("active"); gameMode=c.dataset.gm; sv("ct-mode",gameMode); qIndex=0; render(); });
  });
})();

/* ===== boot ===== */
updateStats();
updateWeak();
render();
