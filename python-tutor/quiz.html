<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Guess the Output — endless Python puzzles</title>
<style>
  :root{
    --night-0:#0c0d2b; --night-1:#15123f; --night-2:#1d1850;
    --surface:#221c57; --surface-soft:#2a2466; --ink:#090a1c;
    --cream:#f4eddd; --cream-dim:#bdb6d8;
    --saffron:#f2a93b; --saffron-soft:#f6c878;
    --jade:#74d6c3; --lotus:#c9a7f0; --coral:#f0856f;
    --hair:rgba(244,237,221,0.12);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Monaco,"Cascadia Code",Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 700px at 80% -10%, #2a2068 0%, transparent 55%),
      radial-gradient(900px 600px at 0% 110%, #241a5a 0%, transparent 50%),
      linear-gradient(160deg, var(--night-0), var(--night-1) 60%, var(--night-2));
    color:var(--cream); font-family:var(--sans); line-height:1.55; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:680px;margin:0 auto;padding:20px 16px 60px;}
  header.top{text-align:center;margin-bottom:12px;}
  .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--saffron);opacity:.85;}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(26px,8vw,40px);margin:6px 0 4px;}
  h1 .glow{color:var(--saffron-soft);}
  .sub{color:var(--cream-dim);font-size:13.5px;max-width:42ch;margin:0 auto;}

  .nav{display:flex;justify-content:center;gap:8px;margin:12px 0 14px;flex-wrap:wrap;}
  .pill{font-size:12.5px;font-weight:600;border:1px solid var(--hair);background:var(--surface);color:var(--cream-dim);border-radius:999px;padding:7px 13px;cursor:pointer;text-decoration:none;display:inline-block;}
  .pill:hover{color:var(--cream);}
  .pill.lvl.active{background:var(--saffron);color:var(--night-0);border-color:var(--saffron);}

  .stats{display:flex;gap:10px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
  .stat{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:8px 14px;text-align:center;min-width:84px;}
  .stat .n{font-family:var(--serif);font-size:20px;line-height:1;}
  .stat .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cream-dim);margin-top:3px;}
  .stat.stars .n{color:var(--saffron-soft);}
  .stat.streak .n{color:var(--jade);}
  .stat.solved .n{color:var(--lotus);}

  .card{background:linear-gradient(180deg,var(--surface),rgba(29,24,80,.7));border:1px solid var(--hair);border-radius:20px;padding:18px 16px;box-shadow:0 16px 40px -24px rgba(0,0,0,.8);}
  .qrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
  .qlabel{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--saffron);}
  .qworth{font-family:var(--mono);font-size:11px;color:var(--saffron-soft);}
  .ask{font-size:15px;color:var(--cream);margin:0 0 10px;}
  .ask b{color:var(--saffron-soft);}

  .editor{background:var(--ink);border:1px solid rgba(244,237,221,.10);border-radius:13px;overflow:hidden;}
  .ebar{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid rgba(244,237,221,.07);}
  .ebar .d{width:10px;height:10px;border-radius:50%;}
  .ebar .r{background:#ff6b6b;}.ebar .y{background:#ffce5b;}.ebar .g{background:#74d6c3;}
  .ebar .fn{margin-left:6px;font-family:var(--mono);font-size:11px;color:var(--cream-dim);}
  pre.code{margin:0;padding:14px 15px;font-family:var(--mono);font-size:14px;line-height:1.7;color:#e9e3ff;white-space:pre;overflow-x:auto;tab-size:4;}

  .alabel{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cream-dim);margin:15px 0 7px;}
  textarea.ans{width:100%;min-height:54px;resize:vertical;background:var(--ink);border:1px solid var(--hair);border-radius:11px;color:var(--cream);font-family:var(--mono);font-size:14px;line-height:1.6;padding:11px 13px;outline:none;}
  textarea.ans:focus{border-color:var(--saffron);}

  .hints{margin-top:12px;}
  .hint-bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
  .hint-bar .htitle{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--cream-dim);margin-right:2px;}
  .hbtn{font-size:12.5px;font-weight:600;border:1px solid rgba(201,167,240,.35);background:rgba(201,167,240,.10);color:var(--lotus);border-radius:999px;padding:6px 11px;cursor:pointer;}
  .hbtn:disabled{opacity:.4;cursor:not-allowed;}
  .hbtn.used{background:rgba(116,214,195,.12);border-color:rgba(116,214,195,.4);color:var(--jade);cursor:default;}
  .hint-out{margin-top:9px;display:flex;flex-direction:column;gap:6px;}
  .hint-card{background:rgba(201,167,240,.08);border:1px solid rgba(201,167,240,.22);border-radius:10px;padding:8px 11px;font-size:13.5px;color:var(--cream);}
  .hint-card b{color:var(--lotus);}
  .hint-card .c{font-family:var(--mono);font-size:12.5px;background:rgba(9,10,28,.6);padding:1px 5px;border-radius:5px;color:var(--jade);}

  .controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  button{font-family:var(--sans);font-size:14.5px;font-weight:600;border:0;border-radius:11px;padding:11px 18px;cursor:pointer;transition:transform .1s ease,filter .15s ease;}
  button:active{transform:translateY(1px);}
  .btn-check{background:linear-gradient(160deg,var(--saffron),#dd8e23);color:var(--night-0);}
  .btn-next{background:linear-gradient(160deg,var(--jade),#48b6a2);color:var(--night-0);}
  .btn-ghost{background:transparent;color:var(--cream-dim);border:1px solid var(--hair);font-weight:500;}

  .fb{margin-top:13px;border-radius:12px;padding:12px 14px;font-size:14.5px;display:none;}
  .fb.show{display:block;}
  .fb.win{background:rgba(116,214,195,.12);border:1px solid rgba(116,214,195,.4);}
  .fb.win b{color:var(--jade);}
  .fb.miss{background:rgba(240,133,111,.10);border:1px solid rgba(240,133,111,.4);}
  .fb.miss b{color:var(--coral);}
  .fb.almost{background:rgba(242,169,59,.10);border:1px solid rgba(242,169,59,.4);}
  .fb.almost b{color:var(--saffron-soft);}
  .fb .real{display:block;margin-top:7px;font-family:var(--mono);font-size:13.5px;background:rgba(9,10,28,.55);border-radius:8px;padding:8px 10px;color:var(--cream);white-space:pre-wrap;}
  .fb .why{margin-top:8px;font-size:13.5px;color:var(--cream-dim);}
  .fb .why b{color:var(--lotus);}

  .footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:0 4px;}
  .footer small{color:var(--cream-dim);font-size:11.5px;}
  .footer .reset{background:none;border:0;color:var(--cream-dim);font-size:11.5px;text-decoration:underline;cursor:pointer;padding:0;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="kicker">endless puzzles</div>
    <h1>Guess the <span class="glow">Output</span></h1>
    <p class="sub">Read the code. Type what it prints. Earn ⭐ — spend ⭐ on hints when it gets tricky.</p>
  </header>

  <div class="nav">
    <a class="pill" href="index.html" style="text-decoration:none;">← Lessons &amp; AI tutor</a>
    <button class="pill lvl active" data-mode="easy">Easy ⭐</button>
    <button class="pill lvl" data-mode="medium">Medium ⭐⭐</button>
    <button class="pill lvl" data-mode="hard">Hard ⭐⭐⭐</button>
    <button class="pill lvl" data-mode="mix">Mix 🎲</button>
  </div>

  <div class="stats">
    <div class="stat stars"><div class="n" id="stStars">5</div><div class="l">stars</div></div>
    <div class="stat streak"><div class="n" id="stStreak">0</div><div class="l">streak</div></div>
    <div class="stat solved"><div class="n" id="stSolved">0</div><div class="l">solved</div></div>
  </div>

  <main class="card" id="card"></main>

  <div class="footer">
    <small>Type the output exactly as Python would print it.</small>
    <button class="reset" id="resetBtn">Reset stars</button>
  </div>
</div>

<script>
/* ============================================================
   Guess the Output — endless, self-checking Python puzzle game.
   Questions are GENERATED on the fly and their outputs COMPUTED in
   JavaScript (mirroring Python), so answers are always correct and
   never run out. Stars are earned for correct answers and spent on hints.
   ============================================================ */

/* ---------- helpers ---------- */
function ri(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function pickn(a,n){const c=a.slice();const r=[];while(r.length<n&&c.length){r.push(c.splice(Math.floor(Math.random()*c.length),1)[0]);}return r;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function norm(s){return String(s).replace(/\r/g,"").split("\n").map(x=>x.replace(/[ \t]+/g," ").trim()).join("\n").replace(/\n+$/,"").replace(/^\n+/,"");}
const PB="True", PF="False";
const tf=(b)=>b?PB:PF;

/* word pools */
const W=["cat","sun","moon","code","star","data","loop","city","tree","fish","milk","rose","bird","gold"];
const LONG=["python","banana","planet","orange","coding","rocket","mantra","garden","silver","dragon","forest"];
const NAMES=["Sasi","Ravi","Ada","Sam","Maya","Leo","Nila","Arjun","Tara","Kiran"];
const REPEAT=["banana","apple","hello","coffee","pepper","balloon","success","letter"];

/* ---------- generators: each returns {code,out,why,concept,level} ---------- */
const GEN={
 1:[ // EASY
  ()=>{const w=pick(W); return {code:`print("${w}")`, out:w, concept:"print() and text in quotes", why:`print() shows whatever is inside the quotes, exactly.`};},
  ()=>{const a=ri(2,20),b=ri(2,20); return {code:`print(${a} + ${b})`, out:""+(a+b), concept:"addition", why:`${a} + ${b} = ${a+b}.`};},
  ()=>{const a=ri(12,30),b=ri(1,a-1); return {code:`print(${a} - ${b})`, out:""+(a-b), concept:"subtraction", why:`${a} - ${b} = ${a-b}.`};},
  ()=>{const a=ri(2,9),b=ri(2,9); return {code:`print(${a} * ${b})`, out:""+(a*b), concept:"multiplication (*)", why:`${a} * ${b} = ${a*b}.`};},
  ()=>{const s=pick(["ab","hi","-","*","ha","ok","na","go"]),n=ri(2,5); return {code:`print("${s}" * ${n})`, out:s.repeat(n), concept:"a string times a number repeats it", why:`"${s}" repeated ${n} times is "${s.repeat(n)}".`};},
  ()=>{const a=pick(W),b=pick(W); return {code:`print("${a}" + "${b}")`, out:a+b, concept:"+ joins (concatenates) strings", why:`"${a}" + "${b}" sticks them together: "${a+b}".`};},
  ()=>{const nm=pick(NAMES); return {code:`name = "${nm}"\nprint(f"Hi {name}")`, out:`Hi ${nm}`, concept:"f-strings drop a box's value into { }", why:`The f-string puts ${nm} where {name} is.`};},
  ()=>{const w=pick(W.concat(LONG)); return {code:`print(len("${w}"))`, out:""+w.length, concept:"len() counts characters", why:`"${w}" has ${w.length} letters.`};},
  ()=>{const w=pick(W); return {code:`w = "${w}"\nprint(w[0])`, out:w[0], concept:"indexing starts at 0", why:`[0] is the first character: "${w[0]}".`};},
  ()=>{const w=pick(W); return {code:`w = "${w}"\nprint(w[-1])`, out:w[w.length-1], concept:"[-1] is the last item", why:`The last character of "${w}" is "${w[w.length-1]}".`};},
  ()=>{const w=pick(W); return {code:`print("${w}".upper())`, out:w.toUpperCase(), concept:".upper() shouts (uppercase)", why:`.upper() turns "${w}" into "${w.toUpperCase()}".`};},
  ()=>{const w=pick(W); return {code:`print("${w.toUpperCase()}".lower())`, out:w, concept:".lower() whispers (lowercase)", why:`.lower() turns "${w.toUpperCase()}" into "${w}".`};},
 ],
 2:[ // MEDIUM
  ()=>{const a=ri(10,40),b=ri(2,6); return {code:`print(${a} // ${b})`, out:""+Math.floor(a/b), concept:"// is floor division (no remainder)", why:`${a} // ${b} keeps only the whole part: ${Math.floor(a/b)}.`};},
  ()=>{const a=ri(10,40),b=ri(2,7); return {code:`print(${a} % ${b})`, out:""+(a%b), concept:"% gives the remainder", why:`${a} divided by ${b} leaves a remainder of ${a%b}.`};},
  ()=>{const base=ri(2,5),e=ri(2,3); return {code:`print(${base} ** ${e})`, out:""+Math.pow(base,e), concept:"** means 'to the power of'", why:`${base} ** ${e} = ${Math.pow(base,e)}.`};},
  ()=>{const b=ri(2,6),r=ri(2,9),a=b*r; return {code:`print(${a} / ${b})`, out:r+".0", concept:"a single / always gives a float", why:`${a} / ${b} = ${r}, but / prints it as a decimal: ${r}.0.`};},
  ()=>{const w=pick(LONG),i=ri(0,1),j=ri(i+2,w.length); return {code:`w = "${w}"\nprint(w[${i}:${j}])`, out:w.slice(i,j), concept:"slicing [i:j] stops BEFORE j", why:`[${i}:${j}] takes characters ${i} up to (not including) ${j}: "${w.slice(i,j)}".`};},
  ()=>{const arr=pickn([1,2,3,4,5,6,7,8,9],ri(3,4)); return {code:`nums = [${arr.join(", ")}]\nprint(len(nums))`, out:""+arr.length, concept:"len() counts list items", why:`The list has ${arr.length} items.`};},
  ()=>{const arr=pickn([5,10,15,20,25,30,35],3),idx=ri(0,2); return {code:`nums = [${arr.join(", ")}]\nprint(nums[${idx}])`, out:""+arr[idx], concept:"list indexing (from 0)", why:`Index ${idx} is the ${["first","second","third"][idx]} item: ${arr[idx]}.`};},
  ()=>{const arr=pickn([1,2,3,4,5,6],2),x=ri(7,9); return {code:`nums = [${arr.join(", ")}]\nnums.append(${x})\nprint(nums)`, out:"["+arr.concat(x).join(", ")+"]", concept:".append() adds to the end", why:`After appending ${x}, the list is [${arr.concat(x).join(", ")}].`};},
  ()=>{const arr=pickn([1,2,3,4,5,6,7,8],ri(3,4)); return {code:`print(sum([${arr.join(", ")}]))`, out:""+arr.reduce((p,c)=>p+c,0), concept:"sum() adds every number", why:`${arr.join(" + ")} = ${arr.reduce((p,c)=>p+c,0)}.`};},
  ()=>{const a=ri(1,9),b=ri(1,9),op=pick([">","<",">=","<=","==","!="]); const r={">":a>b,"<":a<b,">=":a>=b,"<=":a<=b,"==":a===b,"!=":a!==b}[op]; return {code:`print(${a} ${op} ${b})`, out:tf(r), concept:"comparisons give True or False", why:`${a} ${op} ${b} is ${tf(r)}.`};},
  ()=>{const A=pick([PB,PF]),B=pick([PB,PF]),op=pick(["and","or"]); const r= op==="and"?(A===PB&&B===PB):(A===PB||B===PB); return {code:`print(${A} ${op} ${B})`, out:tf(r), concept:`"${op}" combines True/False`, why:op==="and"?`"and" needs BOTH true → ${tf(r)}.`:`"or" needs at least one true → ${tf(r)}.`};},
  ()=>{const A=pick([PB,PF]); return {code:`print(not ${A})`, out:tf(A!==PB), concept:`"not" flips True/False`, why:`not ${A} is ${tf(A!==PB)}.`};},
  ()=>{const w=pick(W),inIt=Math.random()<0.5; const ch=inIt?pick(w.split("")):pick("xyzqwk".split("").filter(c=>!w.includes(c))); const r=w.includes(ch); return {code:`print("${ch}" in "${w}")`, out:tf(r), concept:'"in" checks if something is inside', why:`"${ch}" ${r?"is":"is not"} inside "${w}".`};},
  ()=>{const x=ri(1,10),t=ri(3,7); return {code:`x = ${x}\nif x > ${t}:\n    print("big")\nelse:\n    print("small")`, out:(x>t)?"big":"small", concept:"if/else picks one branch", why:`${x} > ${t} is ${tf(x>t)}, so it prints "${(x>t)?"big":"small"}".`};},
  ()=>{const arr=pickn([2,4,6,8,9,11,3,7],3),which=pick(["min","max"]); const v=which==="min"?Math.min(...arr):Math.max(...arr); return {code:`print(${which}(${arr.join(", ")}))`, out:""+v, concept:`${which}() finds the ${which==="min"?"smallest":"largest"}`, why:`The ${which==="min"?"smallest":"largest"} of ${arr.join(", ")} is ${v}.`};},
  ()=>{const n=ri(2,15); return {code:`print(abs(-${n}))`, out:""+n, concept:"abs() removes the minus sign", why:`abs(-${n}) = ${n}.`};},
  ()=>{const i=ri(1,8),d=pick([3,7]); const x=i+"."+d; const r=d===3?i:i+1; return {code:`print(round(${x}))`, out:""+r, concept:"round() rounds to a whole number", why:`${x} rounds to ${r}.`};},
  ()=>{const ks=pickn(["a","b","c","x","y"],2),vs=pickn([1,2,3,4,5,6],2); const i=ri(0,1); return {code:`d = {"${ks[0]}": ${vs[0]}, "${ks[1]}": ${vs[1]}}\nprint(d["${ks[i]}"])`, out:""+vs[i], concept:"dictionary lookup by key", why:`Key "${ks[i]}" holds the value ${vs[i]}.`};},
  ()=>{const k1=pick(["a","x","p"]),k2=pick(["b","y","q"]); return {code:`d = {"${k1}": 10}\nd["${k2}"] = 20\nprint(len(d))`, out:"2", concept:"adding a key grows the dictionary", why:`After adding "${k2}", the dictionary has 2 pairs.`};},
 ],
 3:[ // HARD
  ()=>{const n=ri(2,4); return {code:`for i in range(${n}):\n    print(i)`, out:Array.from({length:n},(_,i)=>i).join("\n"), concept:"range(n) loops 0 … n-1", why:`range(${n}) gives ${Array.from({length:n},(_,i)=>i).join(", ")}, each on its own line.`};},
  ()=>{const a=ri(1,3),b=a+ri(2,3); return {code:`for i in range(${a}, ${b}):\n    print(i)`, out:Array.from({length:b-a},(_,i)=>a+i).join("\n"), concept:"range(a, b) starts at a, stops before b", why:`It prints ${a} up to ${b-1}.`};},
  ()=>{const n=ri(3,6); const s=n*(n+1)/2; return {code:`total = 0\nfor i in range(1, ${n+1}):\n    total = total + i\nprint(total)`, out:""+s, concept:"adding up in a loop (accumulation)", why:`It adds 1+2+…+${n} = ${s}.`};},
  ()=>{const arr=pickn([2,3,4,5,6,7,8],3); const s=arr.reduce((p,c)=>p+c,0); return {code:`total = 0\nfor n in [${arr.join(", ")}]:\n    total = total + n\nprint(total)`, out:""+s, concept:"looping over a list to total it", why:`${arr.join(" + ")} = ${s}.`};},
  ()=>{const n=ri(3,6); return {code:`count = 0\nwhile count < ${n}:\n    count = count + 1\nprint(count)`, out:""+n, concept:"a while loop repeats until its test fails", why:`count climbs from 0 to ${n}, then the loop stops.`};},
  ()=>{const n=ri(4,7); const evens=[];for(let i=0;i<n;i++)if(i%2===0)evens.push(i); return {code:`for i in range(${n}):\n    if i % 2 == 0:\n        print(i)`, out:evens.join("\n"), concept:"loop + if + % to pick even numbers", why:`i % 2 == 0 is true for ${evens.join(", ")}.`};},
  ()=>{const ch=pick(["*","ab","x","-","#"]),n=ri(2,5); return {code:`s = ""\nfor i in range(${n}):\n    s = s + "${ch}"\nprint(s)`, out:ch.repeat(n), concept:"building a string piece by piece", why:`"${ch}" gets added ${n} times → "${ch.repeat(n)}".`};},
  ()=>{const a=ri(2,9),b=ri(2,9); return {code:`a = ${a}\nb = ${b}\nprint(f"{a * b}")`, out:""+(a*b), concept:"f-strings can do math inside { }", why:`{a * b} works out ${a} * ${b} = ${a*b}.`};},
  ()=>{const w=pick(REPEAT); const chs=[...new Set(w.split(""))]; const ch=pick(chs); const c=w.split("").filter(x=>x===ch).length; return {code:`s = "${w}"\nprint(s.count("${ch}"))`, out:""+c, concept:".count() counts how many times something appears", why:`"${ch}" appears ${c} time${c===1?"":"s"} in "${w}".`};},
  ()=>{const a=ri(2,9),b=ri(1,5); return {code:`x = ${a}\nx = x * 2\nx = x - ${b}\nprint(x)`, out:""+(a*2-b), concept:"a variable updates step by step", why:`${a} → ${a}*2 = ${a*2} → ${a*2} - ${b} = ${a*2-b}.`};},
  ()=>{const a=ri(1,9),b=ri(1,9),c=ri(1,9); const r=(a>b)&&(b>c); return {code:`a = ${a}\nb = ${b}\nc = ${c}\nprint(a > b and b > c)`, out:tf(r), concept:"combining two comparisons with 'and'", why:`(${a} > ${b}) is ${tf(a>b)} and (${b} > ${c}) is ${tf(b>c)} → ${tf(r)}.`};},
 ]
};

/* ---------- star economy + state ---------- */
const SK={stars:"pq-quiz-stars", streak:"pq-quiz-streak", solved:"pq-quiz-solved"};
function load(k,def){ try{const v=localStorage.getItem(k); return v==null?def:parseInt(v,10);}catch(e){ return def; } }
function save(k,v){ try{localStorage.setItem(k,String(v)); }catch(e){} }
let stars=load(SK.stars,5), streak=load(SK.streak,0), solved=load(SK.solved,0);
let mode="easy", cur=null, answered=false, bought=[];

function levelForMode(){ if(mode==="mix") return ri(1,3); return {easy:1,medium:2,hard:3}[mode]; }
function newQuestion(){
  const lvl=levelForMode();
  const q=pick(GEN[lvl])();
  q.level=lvl;
  return q;
}

function updateStats(){
  document.getElementById("stStars").textContent=stars;
  document.getElementById("stStreak").textContent=streak;
  document.getElementById("stSolved").textContent=solved;
}

/* ---------- hints ---------- */
function shapeHint(out){
  if(out.includes("\n")) return `The output is <b>${out.split("\n").length} separate lines</b>.`;
  if(out===PB||out===PF) return `The answer is just <b>True</b> or <b>False</b>.`;
  if(/^-?\d+\.\d+$/.test(out)) return `The output is a <b>decimal number</b> (it has a dot).`;
  if(/^-?\d+$/.test(out)) return `The output is a <b>single whole number</b>.`;
  if(out.startsWith("[")) return `The output is a <b>list</b>, printed like <span class="c">[ ... ]</span>.`;
  return `The output is a <b>short piece of text</b> (${out.length} characters).`;
}
function revealHint(out){
  if(out.includes("\n")){ const first=out.split("\n")[0]; return `It begins with the line: <span class="c">${esc(first)}</span>`; }
  if(out.length<=2) return `It's very short — it starts with <span class="c">${esc(out[0])}</span> (only ${out.length} character${out.length===1?"":"s"}).`;
  return `It starts with <span class="c">${esc(out.slice(0,Math.max(1,Math.ceil(out.length/3))))}</span>…`;
}
const HINTS=[
 {cost:1,label:"Concept",make:q=>`<b>Concept:</b> ${q.concept}.`},
 {cost:2,label:"Shape",make:q=>`<b>Shape:</b> ${shapeHint(q.out)}`},
 {cost:3,label:"Reveal start",make:q=>`<b>Reveal:</b> ${revealHint(q.out)}`},
];

function renderHintBar(){
  const bar=document.getElementById("hintBar");
  if(!bar) return;
  bar.querySelectorAll(".hbtn").forEach((btn,i)=>{
    const h=HINTS[i];
    if(bought.includes(i)){ btn.classList.add("used"); btn.disabled=true; btn.textContent=h.label+" ✓"; }
    else { btn.disabled = answered || stars<h.cost; btn.textContent=`${h.label} (${h.cost}⭐)`; }
  });
}
function buyHint(i){
  if(answered||bought.includes(i)) return;
  const h=HINTS[i];
  if(stars<h.cost) return;
  stars-=h.cost; save(SK.stars,stars); bought.push(i);
  updateStats();
  const out=document.getElementById("hintOut");
  const div=document.createElement("div"); div.className="hint-card"; div.innerHTML=h.make(cur);
  out.appendChild(div);
  renderHintBar();
}

/* ---------- render ---------- */
function worth(lvl){ return "⭐".repeat(lvl)+` (+${lvl})`; }
function render(){
  answered=false; bought=[];
  cur=newQuestion();
  updateStats();
  document.getElementById("card").innerHTML=`
    <div class="qrow">
      <span class="qlabel">${["","Easy","Medium","Hard"][cur.level]} puzzle</span>
      <span class="qworth">worth ${worth(cur.level)}</span>
    </div>
    <div class="ask">What will this code <b>print</b>?</div>
    <div class="editor">
      <div class="ebar"><span class="d r"></span><span class="d y"></span><span class="d g"></span><span class="fn">guess.py</span></div>
      <pre class="code">${esc(cur.code)}</pre>
    </div>
    <div class="alabel"><span>⌨</span> Your answer</div>
    <textarea class="ans" id="ans" spellcheck="false" placeholder="Type exactly what gets printed…"></textarea>
    <div class="hints">
      <div class="hint-bar" id="hintBar">
        <span class="htitle">Stuck? Buy a hint:</span>
        <button class="hbtn" data-h="0"></button>
        <button class="hbtn" data-h="1"></button>
        <button class="hbtn" data-h="2"></button>
      </div>
      <div class="hint-out" id="hintOut"></div>
    </div>
    <div class="controls">
      <button class="btn-check" id="checkBtn">Check</button>
      <button class="btn-ghost" id="skipBtn">Skip →</button>
    </div>
    <div class="fb" id="fb"></div>`;
  const ans=document.getElementById("ans"); ans.focus();
  ans.addEventListener("keydown",e=>{ if((e.ctrlKey||e.metaKey)&&e.key==="Enter") check(); });
  document.getElementById("checkBtn").addEventListener("click",check);
  document.getElementById("skipBtn").addEventListener("click",next);
  document.querySelectorAll("#hintBar .hbtn").forEach(b=>b.addEventListener("click",()=>buyHint(parseInt(b.dataset.h,10))));
  renderHintBar();
}

function realBlock(){ return `<span class="real">${esc(cur.out)}</span><div class="why"><b>Why:</b> ${cur.why}</div>`; }
function showFb(kind,html){ const fb=document.getElementById("fb"); fb.className="fb "+kind+" show"; fb.innerHTML=html; }
function lock(){
  answered=true;
  document.getElementById("checkBtn").style.display="none";
  const skip=document.getElementById("skipBtn"); skip.textContent="Next →"; skip.className="btn-next";
  renderHintBar();
}

function check(){
  if(answered) return;
  const user=norm(document.getElementById("ans").value);
  const expect=norm(cur.out);
  if(user===expect){
    const reward=cur.level;
    stars+=reward; streak++; solved++;
    save(SK.stars,stars); save(SK.streak,streak); save(SK.solved,solved); updateStats();
    let bonus = streak>0 && streak%5===0 ? ` 🔥 <b>${streak} streak — keep going!</b>` : "";
    showFb("win",`<b>✓ Correct! +${reward}⭐</b> Nicely read.${bonus}`+realBlock());
    lock();
  } else if(user.length && user.toLowerCase()===expect.toLowerCase()){
    streak=0; save(SK.streak,streak); updateStats();
    showFb("almost","<b>So close!</b> Right letters, wrong capitalisation — Python prints it like this:"+realBlock());
    lock();
  } else {
    streak=0; save(SK.streak,streak); updateStats();
    showFb("miss","<b>Not quite.</b> The real output is:"+realBlock());
    lock();
  }
}
function next(){ render(); }

/* ---------- level selector ---------- */
document.querySelectorAll(".pill.lvl").forEach(p=>{
  p.addEventListener("click",()=>{
    document.querySelectorAll(".pill.lvl").forEach(x=>x.classList.remove("active"));
    p.classList.add("active");
    mode=p.dataset.mode;
    render();
  });
});
document.getElementById("resetBtn").addEventListener("click",()=>{
  stars=5; streak=0; solved=0;
  save(SK.stars,stars); save(SK.streak,streak); save(SK.solved,solved);
  updateStats(); render();
});

/* ---------- boot ---------- */
updateStats();
render();
</script>
</body>
</html>
