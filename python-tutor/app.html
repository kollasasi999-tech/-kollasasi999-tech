   COMPUTE the correct output of every generated program, so the

function scanLine(line){

 {icon:&quot;📋&quot;,title:&quot;Lists&quot;,

 {icon:&quot;🔁&quot;,title:&quot;Loops&quot;,

 {icon:&quot;🔀&quot;,title:&quot;If / Else&quot;,

 {icon:&quot;🛠️&quot;,title:&quot;Functions&quot;,

 {icon:&quot;➕&quot;,title:&quot;Totals with +=&quot;,

 {icon:&quot;🛑&quot;,title:&quot;break &amp; continue&quot;,

 {icon:&quot;📦&quot;,title:&quot;Tuples &amp; unpacking&quot;,

 {icon:&quot;✂️&quot;,title:&quot;Text tools&quot;,

 {icon:&quot;🧰&quot;,title:&quot;Built-in helpers&quot;,

 {icon:&quot;⚡&quot;,title:&quot;List comprehensions&quot;,

 {icon:&quot;🎯&quot;,title:&quot;Sets&quot;,

const PHASES=[&quot;Learn&quot;,&quot;Predict&quot;,&quot;Write&quot;];

function checkWrite(code){
  const w=MODULES[li].write, res=runPy(code);
  if(res.err) return {ok:false,err:res.err};
  if(w.need){for(const s of w.need){if(!code.includes(s))return {ok:false,msg:`Make sure your code uses <code>${esc(s)}</code>.`};}}
  if(w.kind===&quot;output&quot;) return {ok:norm(res.out)===norm(w.expected),got:res.out};
  const full=runPy(code+&quot;\n&quot;+w.tests); if(full.err) return {ok:false,err:full.err};
  let t=full.out; if(t.startsWith(res.out)) t=t.slice(res.out.length);
  return {ok:norm(t)===norm(w.expectedTests),got:t};
}

function wsubmit(){
  const w=MODULES[li].write, r=checkWrite(document.getElementById(&quot;wcode&quot;).value), fb=document.getElementById(&quot;fb&quot;);
  if(r.ok){ fb.className=&quot;fb win show&quot;; fb.innerHTML=&quot;<b>✓ Your code works!</b><div class='why' style='margin-top:7px;'><b>Why:</b> &quot;+w.why+&quot;</div><div class='why' style='margin-top:5px;'><b>A clean solution:</b></div><div class='wsol'>&quot;+esc(w.solution)+&quot;</div>&quot;; award(); writeAdvance(); return; }
  attempts++;

function pickn(a,n){const c=a.slice();const r=[];while(r.length<n&amp;&amp;c.length){r.push(c.splice(Math.floor(Math.random()*c.length),1)[0]);}return r;}
function esc(s){return String(s).replace(/&amp;/g,&quot;&amp;amp;&quot;).replace(/</g,&quot;&amp;lt;&quot;).replace(/>/g,&quot;&amp;gt;&quot;);}
function norm(s){return String(s).replace(/\r/g,&quot;&quot;).split(&quot;\n&quot;).map(x=>x.replace(/[ \t]+/g,&quot; &quot;).trim()).join(&quot;\n&quot;).replace(/\n+$/,&quot;&quot;).replace(/^\n+/,&quot;&quot;);}
function pyItem(x){return typeof x===&quot;string&quot;?&quot;'&quot;+x+&quot;'&quot;:(x===true?&quot;True&quot;:x===false?&quot;False&quot;:x);}
function pyList(a){return &quot;[&quot;+a.map(pyItem).join(&quot;, &quot;)+&quot;]&quot;;}
function pyTup(a){return (a.length===1?&quot;(&quot;+pyItem(a[0])+&quot;,)&quot;:&quot;(&quot;+a.map(pyItem).join(&quot;, &quot;)+&quot;)&quot;);}
function fdiv(a,b){return Math.floor(a/b);}
function pmod(a,b){return ((a%b)+b)%b;}

function rankFor(xp){ let r=RANKS[0],nxt=null; for(let i=0;i<RANKS.length;i++){ if(xp>=RANKS[i][0]){r=RANKS[i];nxt=RANKS[i+1]||null;} } return {name:r[1],base:r[0],next:nxt}; }

/* ===== persistence ===== */
const SK={stars:&quot;ct-stars&quot;,streak:&quot;ct-streak&quot;,solved:&quot;ct-solved&quot;,xp:&quot;ct-xp&quot;,badges:&quot;ct-badges&quot;,srs:&quot;ct-srs&quot;,clock:&quot;ct-clock&quot;};
function ld(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
let stars=ld(SK.stars,5), streak=ld(SK.streak,0), solved=ld(SK.solved,0), xp=ld(SK.xp,0);
let badges=ld(SK.badges,[]);
let srs=ld(SK.srs,{}), clock=ld(SK.clock,0);
let mode=&quot;easy&quot;, topic=&quot;all&quot;, cur=null, attempts=0, solvedThis=false, bought=[];
let gameMode=ld(&quot;ct-mode&quot;,&quot;alt&quot;), qIndex=0, curW=null, __lvl=0;
let forceTopic=null, forceLevel=null, reviewed=false;
const TOPIC_KEYS=[&quot;basics&quot;,&quot;strings&quot;,&quot;loops&quot;,&quot;conditionals&quot;,&quot;functions&quot;,&quot;lists&quot;,&quot;dicts&quot;,&quot;tuples&quot;,&quot;methods&quot;,&quot;builtins&quot;,&quot;comprehensions&quot;,&quot;sets&quot;,&quot;errors&quot;];
const SRS_INT=[0,1,3,8,20,50];
function levelFromBox(box){ return box<=2?1:(box<=4?2:3); }
function recordReview(t,success){ if(reviewed) return; reviewed=true; clock++; sv(SK.clock,clock);
  const s=srs[t]||{box:1,seen:0,at:0}; s.box=success?Math.min(5,s.box+1):1; s.seen=(s.seen||0)+1; s.at=clock; srs[t]=s; sv(SK.srs,srs); updateWeak(); }
function pickDueTopic(){ let due=[],rest=[]; for(const t of TOPIC_KEYS){ const s=srs[t]; if(!s){ rest.push({t,box:99,d:Infinity}); continue; } const d=s.at+SRS_INT[s.box]; (d<=clock?due:rest).push({t,box:s.box,d}); } const pool=due.length?due:rest; pool.sort((a,b)=>a.box-b.box||a.d-b.d); return pool[0].t; }
function updateWeak(){ const el=document.getElementById(&quot;weakspots&quot;); if(!el) return; const seen=Object.keys(srs);
  if(!seen.length){ el.textContent=&quot;🩹 Review mode focuses on the topics you miss most.&quot;; return; }
  const weak=seen.filter(t=>srs[t].box<=2).sort((a,b)=>srs[a].box-srs[b].box).slice(0,3);
  el.innerHTML = weak.length ? (&quot;Needs review: &quot;+weak.map(t=>`<span style='color:var(--coral)'>${t}</span>`).join(&quot;, &quot;)) : &quot;<span style='color:var(--jade)'>All topics looking solid! 🎉</span>&quot;; }

function checkBadges(lvl){ if(lvl!=null) __lvl=lvl; for(const b of BADGES){ if(!badges.includes(b.id) &amp;&amp; b.test()){ badges.push(b.id); sv(SK.badges,badges); toast(&quot;<b>Badge unlocked</b> · &quot;+b.label); break; } } }

/* ===== stats / rank UI ===== */
function updateStats(){
  document.getElementById(&quot;stStars&quot;).textContent=stars;
  document.getElementById(&quot;stStreak&quot;).textContent=streak;
  document.getElementById(&quot;stSolved&quot;).textContent=solved;

  else { document.getElementById(&quot;xpFill&quot;).style.width=&quot;100%&quot;; document.getElementById(&quot;xpText&quot;).textContent=`${xp} XP · max rank`; }
}

/* ===== question generation (output computed by runPy) ===== */
function poolFor(){
  const t = forceTopic || topic;
  const lvls = forceLevel ? [forceLevel] : (mode===&quot;mix&quot;?[1,2,3,4]:[{easy:1,medium:2,hard:3,expert:4}[mode]]);
  let items=[];
  for(const lv of lvls) for(const it of GEN[lv]) if(t===&quot;all&quot;||it.topic===t) items.push({lv,it});
  if(!items.length){ for(const lv of lvls) for(const it of GEN[lv]) items.push({lv,it}); } // relax topic
  if(!items.length){ for(const lv of [1,2,3,4]) for(const it of GEN[lv]) items.push({lv,it}); }
  return items;
}
function newQuestion(){
  const pool=poolFor();
  for(let tries=0;tries<25;tries++){
    const {lv,it}=pick(pool);
    const q=it.gen();
    const res=runPy(q.code);
    if(!res.err &amp;&amp; res.out.trim().length){ q.out=res.out.replace(/\n$/,&quot;&quot;); q.level=lv; q.topic=it.topic; return q; }
  }
  // ultra-safe fallback
  const a=ri(2,9),b=ri(2,9);
  return {code:`a = ${a}\nb = ${b}\nprint(a + b)`,out:String(a+b),level:1,topic:&quot;basics&quot;,concept:&quot;variables and +&quot;,why:`${a}+${b}=${a+b}.`};
}

/* ===== hints ===== */
function shapeHint(out){
  if(out.includes(&quot;\n&quot;)) return `It prints <b>${out.split(&quot;\n&quot;).length} lines</b>.`;
  if(out===&quot;True&quot;||out===&quot;False&quot;) return `The answer is just <b>True</b> or <b>False</b>.`;
  if(/^-?\d+$/.test(out)) return `The output is <b>one whole number</b>.`;
  if(out.startsWith(&quot;[&quot;)) return `The output is a <b>list</b> like <span class=&quot;c&quot;>[ ... ]</span>.`;
  if(out.startsWith(&quot;{&quot;)) return `The output is a <b>dictionary</b> like <span class=&quot;c&quot;>{ ... }</span>.`;
  return `The output is <b>text</b> (${out.length} characters).`;
}
function revealHint(out){
  if(out.includes(&quot;\n&quot;)){ return `The first line is: <span class=&quot;c&quot;>${esc(out.split(&quot;\n&quot;)[0])}</span>`; }
  if(out.length<=2) return `It starts with <span class=&quot;c&quot;>${esc(out[0])}</span> (very short).`;
  return `It starts with <span class=&quot;c&quot;>${esc(out.slice(0,Math.max(1,Math.ceil(out.length/3))))}</span>…`;
}
const HINTS=[
 {cost:1,label:&quot;Concept&quot;,make:q=>`<b>Concept:</b> ${q.concept}.`},
 {cost:2,label:&quot;Shape&quot;,make:q=>`<b>Shape:</b> ${shapeHint(q.out)}`},
 {cost:3,label:&quot;Reveal start&quot;,make:q=>`<b>Reveal:</b> ${revealHint(q.out)}`},
];
function renderHintBar(){
  const bar=document.getElementById(&quot;hintBar&quot;); if(!bar) return;
  bar.querySelectorAll(&quot;.hbtn&quot;).forEach((btn,i)=>{ const h=HINTS[i];
    if(bought.includes(i)){ btn.classList.add(&quot;used&quot;); btn.disabled=true; btn.textContent=h.label+&quot; ✓&quot;; }
    else { btn.disabled = solvedThis || stars<h.cost; btn.textContent=`${h.label} (${h.cost}⭐)`; } });
}
function buyHint(i){
  if(solvedThis||bought.includes(i)) return; const h=HINTS[i]; if(stars<h.cost) return;
  stars-=h.cost; sv(SK.stars,stars); bought.push(i); updateStats();
  const div=document.createElement(&quot;div&quot;); div.className=&quot;hint-card&quot;; div.innerHTML=h.make(cur);
  document.getElementById(&quot;hintOut&quot;).appendChild(div); renderHintBar();
}

/* ===== rendering ===== */
function codeHtml(code){ return code.split(&quot;\n&quot;).map((ln,i)=>`<div class=&quot;cl&quot;><span class=&quot;ln&quot;>${i+1}</span><span class=&quot;lt&quot;>${esc(ln)||&quot; &quot;}</span></div>`).join(&quot;&quot;); }
const LVLNAME=[&quot;&quot;,&quot;Easy&quot;,&quot;Medium&quot;,&quot;Hard&quot;,&quot;Expert&quot;];
function worth(lv){ return &quot;⭐&quot;.repeat(lv)+` · +${lv*10} XP`; }
function renderPredict(){
  attempts=0; solvedThis=false; bought=[]; cur=newQuestion(); updateStats();
  document.getElementById(&quot;card&quot;).innerHTML=`
    <div class=&quot;qrow&quot;>
      <span class=&quot;qlabel&quot;>${LVLNAME[cur.level]} · trace it</span>
      <span class=&quot;qtopic&quot;>${cur.topic}</span>

    <div class=&quot;editor&quot;>

      <div class=&quot;code&quot;>${codeHtml(cur.code)}</div>
    </div>
    <div class=&quot;alabel&quot;><span>⌨</span> Your answer (one line per printed line)</div>
    <textarea class=&quot;ans&quot; id=&quot;ans&quot; spellcheck=&quot;false&quot; placeholder=&quot;Type exactly what gets printed…&quot;></textarea>
    <div class=&quot;hints&quot;>

        <span class=&quot;htitle&quot;>Stuck? Hints:</span>
        <button class=&quot;hbtn&quot; data-h=&quot;0&quot;></button>
        <button class=&quot;hbtn&quot; data-h=&quot;1&quot;></button>
        <button class=&quot;hbtn&quot; data-h=&quot;2&quot;></button>
      </div>
      <div class=&quot;hint-out&quot; id=&quot;hintOut&quot;></div>

      <button class=&quot;btn-ghost&quot; id=&quot;skipBtn&quot;>Skip →</button>

  const ans=document.getElementById(&quot;ans&quot;); ans.focus();
  ans.addEventListener(&quot;keydown&quot;,e=>{ if((e.ctrlKey||e.metaKey)&amp;&amp;e.key===&quot;Enter&quot;) check(); });
  document.getElementById(&quot;checkBtn&quot;).addEventListener(&quot;click&quot;,check);

function realBlock(){ return `<span class=&quot;real&quot;>${esc(cur.out)}</span>`
  +`<div class=&quot;why&quot;><b>Step by step:</b> ${cur.why}</div>`
  +`<div class=&quot;why&quot; style=&quot;margin-top:5px;&quot;><b>The idea:</b> ${cur.concept}.</div>`; }
function showFb(kind,html){ const fb=document.getElementById(&quot;fb&quot;); fb.className=&quot;fb &quot;+kind+&quot; show&quot;; fb.innerHTML=html; }
function lockSolved(){
  solvedThis=true;
  document.getElementById(&quot;checkBtn&quot;).style.display=&quot;none&quot;;
  document.getElementById(&quot;giveBtn&quot;).style.display=&quot;none&quot;;
  const skip=document.getElementById(&quot;skipBtn&quot;); skip.textContent=&quot;Next →&quot;; skip.className=&quot;btn-next&quot;;
  renderHintBar();
}

function check(){
  if(solvedThis) return;
  const user=norm(document.getElementById(&quot;ans&quot;).value);
  const expect=norm(cur.out);
  if(user===expect){
    const firstTry = attempts===0 &amp;&amp; bought.length===0;
    const sReward=cur.level, xReward=cur.level*10;
    stars+=sReward; xp+=xReward; solved++;
    if(firstTry) streak++;
    sv(SK.stars,stars); sv(SK.xp,xp); sv(SK.solved,solved); sv(SK.streak,streak);
    updateStats();
    let extra = firstTry?` <b>+${sReward}⭐ · +${xReward} XP</b>` : ` +${sReward}⭐ · +${xReward} XP (you got there — that counts!)`;
    let sb = (firstTry &amp;&amp; streak>0 &amp;&amp; streak%5===0)?` 🔥 ${streak} streak!`:&quot;&quot;;
    showFb(&quot;win&quot;,&quot;<b>✓ Correct!</b>&quot;+extra+sb+realBlock());
    lockSolved(); checkBadges(cur.level); recordReview(cur.topic,true);
    return;
  }
  // wrong — explain why, then let them retry (full walkthrough after the 2nd miss)
  attempts++; streak=0; sv(SK.streak,streak); updateStats();
  const caseOnly = user.length &amp;&amp; user.toLowerCase()===expect.toLowerCase();
  let nudge;
  if(!user) nudge=&quot;Type what the program prints — one line for each thing it prints.&quot;;
  else if(caseOnly) nudge=&quot;Right letters, but Python is <b>case-sensitive</b> — check your capitals (e.g. <span class='c'>True</span>, not <span class='c'>true</span>).&quot;;
  else if(user.split(&quot;\n&quot;).length!==expect.split(&quot;\n&quot;).length) nudge=`Your answer has <b>${user.split(&quot;\n&quot;).length} line(s)</b>, but this program prints <b>${expect.split(&quot;\n&quot;).length} line(s)</b>. Count the <span class='c'>print()</span>s — and how many times each loop repeats.`;
  else nudge=&quot;Right number of lines — but a value is off. Re-check the arithmetic, or which branch the <span class='c'>if</span> takes.&quot;;
  if(attempts>=2){
    showFb(&quot;miss&quot;,&quot;<b>Let's walk through it together.</b> &quot;+nudge+realBlock());
    lockSolved(); recordReview(cur.topic,false);
  } else {
    showFb(caseOnly?&quot;almost&quot;:&quot;miss&quot;,&quot;<b>Not quite — try again.</b> &quot;+nudge
      +`<div class=&quot;why&quot; style=&quot;margin-top:6px;&quot;><b>The idea:</b> ${cur.concept}. <span style=&quot;color:var(--cream-dim)&quot;>(Try once more — your answer stays. A hint reveals the shape or the start; the full walkthrough shows after another try.)</span></div>`);
  }
}
function giveUp(){
  if(solvedThis) return;
  streak=0; sv(SK.streak,streak); updateStats();
  showFb(&quot;almost&quot;,&quot;<b>Here's the answer:</b>&quot;+realBlock());
  lockSolved(); recordReview(cur.topic,false);
}
function next(){ qIndex++; render(); }

function award(level, firstTry){ stars+=level; xp+=level*10; solved++; if(firstTry) streak++; sv(SK.stars,stars); sv(SK.xp,xp); sv(SK.solved,solved); sv(SK.streak,streak); updateStats(); }
function writePoolFor(){ const t=forceTopic||topic; const lvls = forceLevel ? [Math.min(3,forceLevel)] : (mode===&quot;mix&quot;?[1,2,3]:[{easy:1,medium:2,hard:3,expert:3}[mode]]); let items=[]; for(const lv of lvls) for(const it of WGEN[lv]) if(t===&quot;all&quot;||it.topic===t) items.push({lv,it}); if(!items.length){ for(const lv of lvls) for(const it of WGEN[lv]) items.push({lv,it}); } if(!items.length){ for(const lv of [1,2,3]) for(const it of WGEN[lv]) items.push({lv,it}); } return items; }

function renderHintBarW(){ const bar=document.getElementById(&quot;hintBar&quot;); if(!bar) return; bar.querySelectorAll(&quot;.hbtn&quot;).forEach((btn,i)=>{ const h=WHINTS[i]; if(bought.includes(i)){ btn.classList.add(&quot;used&quot;); btn.disabled=true; btn.textContent=h.label+&quot; ✓&quot;; } else { btn.disabled=solvedThis||stars<h.cost; btn.textContent=`${h.label} (${h.cost}⭐)`; } }); }
function buyHintW(i){ if(solvedThis||bought.includes(i)) return; const h=WHINTS[i]; if(stars<h.cost) return; stars-=h.cost; sv(SK.stars,stars); bought.push(i); updateStats(); const div=document.createElement(&quot;div&quot;); div.className=&quot;hint-card&quot;; div.innerHTML=h.make(curW); document.getElementById(&quot;hintOut&quot;).appendChild(div); renderHintBarW(); }

function friendlyError(raw){
  const m=String(raw); let plain=&quot;Something's off in the code.&quot;;
  if(/NameError/.test(m)){ const n=(m.match(/name '([^']+)'/)||[])[1]; plain=`Python doesn't recognise <span class='c'>${esc(n||&quot;that name&quot;)}</span>. Usually a typo, a missing quote (text needs quotes like <span class='c'>&quot;hi&quot;</span>), or using it before you created it.`; }
  else if(/SyntaxError/.test(m)) plain=`There's a typo in the structure — most often a missing <span class='c'>:</span> at the end of an if/for/while/def line, or a missing <span class='c'>)</span> or quote.`;
  else if(/IndexError/.test(m)) plain=`You asked for a list or string position that doesn't exist. Counting starts at <span class='c'>0</span>, so a list of 3 has positions 0, 1, 2.`;
  else if(/KeyError/.test(m)) plain=`That key isn't in the dictionary. Check the spelling, or use <span class='c'>.get(key)</span>.`;
  else if(/str \+ non-str|cannot add string/.test(m)) plain=`You tried to join text and a number with <span class='c'>+</span>. Turn the number into text with <span class='c'>str(...)</span>, or use an f-string: <span class='c'>f&quot;n={n}&quot;</span>.`;
  else if(/not callable/.test(m)) plain=`You tried to &quot;call&quot; something that isn't a function — often an extra pair of <span class='c'>()</span>.`;
  else if(/missing arg/.test(m)) plain=`Your function was called with too few values — give it every input it asks for.`;
  else if(/AttributeError/.test(m)) plain=`That action doesn't exist for this kind of value. For example <span class='c'>.append()</span> is for lists and <span class='c'>.upper()</span> is for text.`;
  else if(/loop too long|RuntimeError/.test(m)) plain=`Your loop never stops — make sure something changes inside it so the condition becomes False.`;
  else if(/cannot unpack|ValueError/.test(m)) plain=`The number of variables doesn't match the data — e.g. <span class='c'>for a, b in ...</span> needs each item to have two parts.`;
  else if(/not iterable/.test(m)) plain=`You tried to loop over something that isn't a sequence (like a plain number). Loop over a list, string, or range.`;
  else if(/not indexable|not sliceable/.test(m)) plain=`You used <span class='c'>[ ]</span> on something that doesn't support it (like a number).`;
  return `<b>What went wrong:</b> ${plain}<br><span style=&quot;color:var(--cream-dim);font-size:11.5px;&quot;>Python's words: ${esc(m)}</span>`;
}
function wrun(){ const res=runPy(document.getElementById(&quot;wcode&quot;).value); const o=document.getElementById(&quot;wout&quot;);
  if(res.err){ o.className=&quot;output err&quot;; o.innerHTML=friendlyError(res.err); }

function checkWrite(code){
  const res=runPy(code);
  if(res.err) return {ok:false,err:res.err};
  if(curW.need){ for(const s of curW.need){ if(!code.includes(s)) return {ok:false,msg:`Make sure your code uses <span class='c'>${esc(s)}</span>.`}; } }
  if(curW.kind===&quot;output&quot;){ return {ok:norm(res.out)===norm(curW.expected),got:res.out}; }
  const full=runPy(code+&quot;\n&quot;+curW.tests);
  if(full.err) return {ok:false,err:full.err};
  let testOut=full.out; if(testOut.startsWith(res.out)) testOut=testOut.slice(res.out.length);
  return {ok:norm(testOut)===norm(curW.expectedTests),got:testOut};
}
function lockWrite(){ solvedThis=true; [&quot;wsubmit&quot;,&quot;wgive&quot;,&quot;wrun&quot;].forEach(id=>{const el=document.getElementById(id); if(el) el.style.display=&quot;none&quot;;}); const skip=document.getElementById(&quot;wskip&quot;); skip.textContent=&quot;Next →&quot;; skip.className=&quot;btn-next&quot;; renderHintBarW(); }
function wsubmit(){

    const firstTry=attempts===0 &amp;&amp; bought.length===0; award(curW.level,firstTry);

    const sb=(firstTry &amp;&amp; streak>0 &amp;&amp; streak%5===0)?` 🔥 ${streak} streak!`:&quot;&quot;;
    showFb(&quot;win&quot;,&quot;<b>✓ Your code works!</b>&quot;+extra+sb
      +`<div class=&quot;why&quot; style=&quot;margin-top:7px;&quot;><b>Why it works:</b> ${curW.why}</div>`
      +`<div class=&quot;why&quot; style=&quot;margin-top:5px;&quot;><b>A clean solution:</b></div><div class=&quot;wsol&quot;>${esc(curW.solution)}</div>`);

  if(attempts>=3){ showFb(&quot;miss&quot;,&quot;<b>Here's one way to do it.</b> &quot;+msg+`<div class=&quot;why&quot; style=&quot;margin-top:7px;&quot;><b>Solution:</b></div><div class=&quot;wsol&quot;>${esc(curW.solution)}</div><div class=&quot;why&quot; style=&quot;margin-top:5px;&quot;>${curW.why}</div>`); lockWrite(); recordReview(curW.topic,false); }
  else showFb(&quot;miss&quot;,&quot;<b>Almost — try again.</b> &quot;+msg+`<div class=&quot;why&quot; style=&quot;margin-top:6px;&quot;><b>Idea:</b> ${curW.concept}. <span style=&quot;color:var(--cream-dim)&quot;>(Press Run to see your output; a hint can show the approach or a full solution.)</span></div>`);
}

/* mini-py.js — a tiny Python interpreter in pure JS for a beginner course.
   Supports: print, variables, f-strings, + - * / %, comparisons, and/or/not,
   lists, indexing, .append, len, dicts, .items, .get, range, for, while,
   if/elif/else, def/return (with default args), .upper/.lower, comments. */

function runPython(src){
  const out=[];
  try{
    const logical=toLogicalLines(src);
    const prog=parseBlock(logical,{i:0},-1);
    const G=Object.create(null);
    execBlock(prog,G,G,out);
    return {out:out.join(&quot;&quot;),err:null};
  }catch(e){
    if(e&amp;&amp;e.__pyerr) return {out:out.join(&quot;&quot;),err:e.message};
    return {out:out.join(&quot;&quot;),err:(e&amp;&amp;e.message)?e.message:String(e)};
  }
}
function pyError(msg){const e=new Error(msg);e.__pyerr=true;return e;}

/* ---------- logical lines (merge multiline brackets, strip comments) ---------- */
function toLogicalLines(src){
  const phys=src.replace(/\r\n/g,&quot;\n&quot;).replace(/\t/g,&quot;    &quot;).split(&quot;\n&quot;);
  const res=[];
  let i=0;
  while(i<phys.length){
    let raw=phys[i];
    const indent=raw.length-raw.trimStart().length;
    let {text,depth,open}=scanLine(raw);
    let buf=text;
    while(open &amp;&amp; i+1<phys.length){
      i++;
      const nxt=scanLine(phys[i]);
      buf+=&quot; &quot;+nxt.text.trim();
      open=nxt.openFrom(depth);
      depth=nxt.depthFrom(depth);
    }
    if(buf.trim().length>0) res.push({indent,text:buf});
    i++;
  }
  return res;
}
/* scanLine returns the comment-stripped text plus bracket bookkeeping helpers */
function scanLine(line){
  let s=&quot;&quot;,depth=0,inStr=false,q=&quot;&quot;,esc=false;
  for(let k=0;k<line.length;k++){
    const c=line[k];
    if(inStr){
      s+=c;
      if(esc){esc=false;}
      else if(c===&quot;\\&quot;){esc=true;}
      else if(c===q){inStr=false;}
      continue;
    }
    if(c===&quot;'&quot;||c==='&quot;'){inStr=true;q=c;s+=c;continue;}
    if(c===&quot;#&quot;){break;}
    if(c===&quot;(&quot;||c===&quot;[&quot;||c===&quot;{&quot;)depth++;
    if(c===&quot;)&quot;||c===&quot;]&quot;||c===&quot;}&quot;)depth--;
    s+=c;
  }
  const open=depth>0;
  return {
    text:s,
    depth,
    open,
    openFrom:(d)=> (d+depth)>0,
    depthFrom:(d)=> d+depth

    if(name===&quot;capitalize&quot;)return obj.charAt(0).toUpperCase()+obj.slice(1).toLowerCase();
    throw pyError(&quot;AttributeError: str has no method '&quot;+name+&quot;'&quot;);
  }
  throw pyError(&quot;AttributeError: no method '&quot;+name+&quot;'&quot;);
}

/* f-strings: parse {expr} parts and evaluate */
function evalFString(raw,scope,G){
  let res=&quot;&quot;,i=0;
  while(i<raw.length){
    const c=raw[i];
    if(c===&quot;{&quot;){
      if(raw[i+1]===&quot;{&quot;){res+=&quot;{&quot;;i+=2;continue;}
      let j=i+1,depth=1,ex=&quot;&quot;;
      while(j<raw.length&amp;&amp;depth>0){const d=raw[j];if(d===&quot;{&quot;)depth++;else if(d===&quot;}&quot;){depth--;if(depth===0)break;}ex+=d;j++;}
      res+=pyStr(evalExpr(parseExpr(ex),scope,G));
      i=j+1;
    } else if(c===&quot;}&quot;){ if(raw[i+1]===&quot;}&quot;){res+=&quot;}&quot;;i+=2;continue;} i++; }
    else { res+=c; i++; }
  }
  return res;
}

/* helpers */
function truthy(v){ if(v===null||v===false)return false; if(v===0||v===&quot;&quot;)return false; if(Array.isArray(v))return v.length>0; if(v instanceof Map)return v.size>0; return true; }
function pyEq(a,b){ if(Array.isArray(a)&amp;&amp;Array.isArray(b))return a.length===b.length&amp;&amp;a.every((x,i)=>pyEq(x,b[i])); return a===b; }
function pyStr(v){
  if(v===null) return &quot;None&quot;;
  if(v===true) return &quot;True&quot;;
  if(v===false) return &quot;False&quot;;
  if(typeof v===&quot;number&quot;) return Number.isInteger(v)?String(v):String(v);
  if(typeof v===&quot;string&quot;) return v;
  if(Array.isArray(v)) return &quot;[&quot;+v.map(pyRepr).join(&quot;, &quot;)+&quot;]&quot;;
  if(v instanceof Map) return &quot;{&quot;+Array.from(v.entries()).map(([k,val])=>pyRepr(k)+&quot;: &quot;+pyRepr(val)).join(&quot;, &quot;)+&quot;}&quot;;
  if(v&amp;&amp;v.__fn) return &quot;<function>&quot;;
  return String(v);
}
function pyRepr(v){ if(typeof v===&quot;string&quot;)return &quot;'&quot;+v+&quot;'&quot;; return pyStr(v); }
function iterate(v){
  if(Array.isArray(v)) return v;
  if(typeof v===&quot;string&quot;) return v.split(&quot;&quot;);
  if(v instanceof Map) return Array.from(v.keys());
  throw pyError(&quot;TypeError: object is not iterable&quot;);
}

/* wire print output through G.__out */
const _origRun=runPython;
function runPythonWrapped(src){
  const out=[];
  try{
    const logical=toLogicalLines(src);
    const prog=parseBlock(logical,{i:0},-1);
    const G=Object.create(null);
    G.__out=out;
    execBlock(prog,G,G,out);
    return {out:out.join(&quot;&quot;),err:null};
  }catch(e){
    if(e&amp;&amp;e.__ret) return {out:out.join(&quot;&quot;),err:null};
    if(e&amp;&amp;e.__pyerr) return {out:out.join(&quot;&quot;),err:e.message};
    return {out:out.join(&quot;&quot;),err:(e&amp;&amp;e.message)?e.message:String(e)};
  }
}

/* ---- Storage that works BOTH inside claude.ai artifacts AND as a downloaded/
   shared file. Tries localStorage first (so progress persists offline), then
   falls back to the artifact's window.storage, then to in-memory. ---- */
const Store=(function(){
  const mem={};
  const hasLS=(()=>{try{localStorage.setItem(&quot;__pq_t&quot;,&quot;1&quot;);localStorage.removeItem(&quot;__pq_t&quot;);return true;}catch(e){return false;}})();
  const hasWS=(typeof window!==&quot;undefined&quot;&amp;&amp;window.storage&amp;&amp;typeof window.storage.get===&quot;function&quot;);
  return {
    async get(k){
      if(hasLS){const v=localStorage.getItem(k);return v==null?null:{value:v};}
      if(hasWS){try{return await window.storage.get(k);}catch(e){}}
      return (k in mem)?{value:mem[k]}:null;
    },
    async set(k,v){
      if(hasLS){try{localStorage.setItem(k,v);return;}catch(e){}}
      if(hasWS){try{return await window.storage.set(k,v);}catch(e){}}
      mem[k]=v;
    }
  };
})();

/* code doctor: if the message looks like pasted code, spot a likely mistake */
function codeDoctor(raw){
  const looksCode = /print\(|=|\(|\[|\n|:/.test(raw) &amp;&amp; /[A-Za-z]/.test(raw);
  if(!looksCode) return null;
  const code=raw;
  const dq=(code.match(/&quot;/g)||[]).length;
  if(dq%2===1) return `It looks like a <b>quote is missing its partner</b>. Every <span class='c'>&quot;</span> needs a matching <span class='c'>&quot;</span> to close the text. Add the missing one.`;
  const op=(code.match(/\(/g)||[]).length, cp=(code.match(/\)/g)||[]).length;
  if(op!==cp &amp;&amp; (op>0||cp>0)) return `A <b>bracket isn't closed</b>: you have ${op} <span class='c'>(</span> and ${cp} <span class='c'>)</span>. Every <span class='c'>(</span> needs a <span class='c'>)</span>.`;
  const assigns=[...code.matchAll(/([A-Za-z_]\w*)\s*=\s*/g)].map(m=>m[1]);
  const pm=code.match(/print\(\s*[&quot;']([A-Za-z_]\w*)[&quot;']\s*\)/);
  if(pm &amp;&amp; assigns.includes(pm[1])) return `You wrote <span class='c'>print(&quot;${pm[1]}&quot;)</span> with quotes, so Python prints the word <b>${pm[1]}</b>. To show what's <b>inside</b> the box, remove the quotes: <span class='c'>print(${pm[1]})</span>.`;
  const colonMsg=t=>`The line <span class='c'>${t}</span> needs a <b>colon</b> <span class='c'>:</span> at the end. Lines that open a block (if, for, while, def) always end with :.`;
  const lines=code.split(&quot;\n&quot;);
  for(const ln of lines){ const t=ln.trim();
    if(/^for\s+[\w ,]+\s+in\s+.+/.test(t) &amp;&amp; !t.endsWith(&quot;:&quot;)) return colonMsg(t);
    if(/^def\s+\w+\s*\(.*\)\s*$/.test(t)) return colonMsg(t);
    if(/^(if|elif|while)\s+.*[=<>()0-9].*/.test(t) &amp;&amp; !t.endsWith(&quot;:&quot;)) return colonMsg(t);
  }
  for(const ln of lines){ const t=ln.trim(); if(/^(if|elif|while)\b/.test(t) &amp;&amp; /[^=!<>]=[^=]/.test(t)) return `Inside an <span class='c'>if</span>, use <b>==</b> to compare, not a single =. (<span class='c'>=</span> stores a value; <span class='c'>==</span> checks equality.)`; }
  return null;
}

function helperAnswer(raw){
  const doc=codeDoctor(raw);
  if(doc) return doc;
  const text=&quot; &quot;+raw.toLowerCase().replace(/[^a-z0-9&quot;'%#={}\[\]() ]/g,&quot; &quot;).replace(/\s+/g,&quot; &quot;)+&quot; &quot;;
  let best=null,bestScore=0;
  for(const e of KB){
    let score=0;
    for(const k of e.keys){
      const key=k.toLowerCase();
      if(key.length<=3){ if(text.includes(&quot; &quot;+key+&quot; &quot;)) score+=1; }
      else { if(text.includes(key)) score+=Math.min(3,1+Math.floor(key.length/5)); }
    }
    if(score>bestScore){bestScore=score;best=e;}
  }
  return best?best.a:FALLBACK;
}

   opens: the doubt + the lesson + the challenge + the code + the run result. */
function buildClaudePrompt(q){
  let p=&quot;You are my patient Python tutor inside a beginner Python learning app. &quot;
    +&quot;I'm just learning the basics (print, variables, f-strings, lists, dictionaries, &quot;
    +&quot;loops, functions). Answer simply in a few short sentences with a tiny example, &quot;
    +&quot;and end with one small tip.\n\nMy question: &quot;+q;
  if(currentTab===&quot;lessons&quot; &amp;&amp; L[state.current-1]){
    const l=L[state.current-1];
    p+=&quot;\n\nI'm on the lesson \&quot;&quot;+l.title+&quot;\&quot;. The task is: &quot;+stripHTML(l.challenge);
  }
  const code=currentCode();
  if(code) p+=&quot;\n\nHere is the code I'm working on right now:\n```python\n&quot;+code+&quot;\n```&quot;;
  if(lastRun){
    if(lastRun.err) p+=&quot;\n\nWhen I run it, I get this error:\n&quot;+lastRun.err;
    else if(lastRun.out &amp;&amp; lastRun.out.trim()) p+=&quot;\n\nWhen I run it, it prints:\n&quot;+lastRun.out.trim();
  }
  return p;
}
function askClaude(){
  const input=document.getElementById(&quot;helperText&quot;);
  let q=(input &amp;&amp; input.value.trim()) || lastQuestion || &quot;&quot;;
  if(!q){
    if(input) input.focus();
    helperAdd(&quot;bot&quot;,&quot;Type your doubt above first, then tap <b>✦ Ask Claude</b> — it'll open claude.ai (your subscription) with your question ready.&quot;);
    return;
  }
  const prompt=buildClaudePrompt(q);
  try{ if(navigator.clipboard) navigator.clipboard.writeText(prompt); }catch(e){}
  window.open(&quot;https://claude.ai/new?q=&quot;+encodeURIComponent(prompt),&quot;_blank&quot;,&quot;noopener&quot;);
  helperAdd(&quot;user&quot;,esc(q));
  helperAdd(&quot;bot&quot;,&quot;Opening <b>claude.ai</b> on your subscription with your question ready ✦<br><span style='font-size:11px;color:var(--cream-dim)'>(I also copied it to your clipboard — if the box is empty, just paste. Nothing is billed per message.)</span>&quot;);
  if(input) input.value=&quot;&quot;;
}

/* ---- Free Llama AI assistant ----
   Primary: Puter.js (no API key — runs Llama in the cloud for you, free).
   Optional: a free Groq key (no credit card) for faster, no-login answers.
   Offline / on failure: falls back to the instant built-in helper. */
let GROQKEY=&quot;&quot;;
const PUTER_MODELS=[&quot;meta-llama/Meta-Llama-3.1-8B-Instruct-Turbo&quot;, null]; // null => Puter's default model
async function loadKey(){ try{const r=await Store.get(&quot;pq-groqkey&quot;); if(r&amp;&amp;r.value) GROQKEY=r.value;}catch(e){} updateModeUI(); }
function updateModeUI(){
  const m=document.getElementById(&quot;helperMode&quot;);
  if(m){ m.textContent = GROQKEY ? &quot;Llama AI ✓ · Groq (free)&quot; : &quot;free Llama AI · no key&quot;; m.style.color=&quot;var(--jade)&quot;; }
}
function formatAI(t){ let s=esc(t); s=s.replace(/```[a-z]*\n?/gi,&quot;&quot;).replace(/`([^`]+)`/g,'<span class=&quot;c&quot;>$1</span>'); s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); s=s.replace(/\n/g,'<br>'); return s; }

/* Pull the text out of whatever shape Puter returns */
function puterText(r){
  if(r==null) return &quot;&quot;;
  if(typeof r===&quot;string&quot;) return r;
  if(r.message){ const c=r.message.content; if(typeof c===&quot;string&quot;) return c; if(Array.isArray(c)) return c.map(x=>(x&amp;&amp;(x.text||x.content))||&quot;&quot;).join(&quot;&quot;); }
  if(typeof r.text===&quot;string&quot;) return r.text;
  if(typeof r.content===&quot;string&quot;) return r.content;
  return &quot;&quot;;
}
async function callGroq(prompt){
  const res=await fetch(&quot;https://api.groq.com/openai/v1/chat/completions&quot;,{
    method:&quot;POST&quot;,
    headers:{&quot;Content-Type&quot;:&quot;application/json&quot;,&quot;Authorization&quot;:&quot;Bearer &quot;+GROQKEY},
    body:JSON.stringify({model:&quot;llama-3.1-8b-instant&quot;,temperature:0.3,max_tokens:700,messages:[{role:&quot;user&quot;,content:prompt}]})
  });
  if(!res.ok) throw new Error(&quot;HTTP &quot;+res.status);
  const d=await res.json();
  const t=d&amp;&amp;d.choices&amp;&amp;d.choices[0]&amp;&amp;d.choices[0].message&amp;&amp;d.choices[0].message.content;
  if(!t) throw new Error(&quot;empty reply&quot;);
  return t;
}
async function callPuter(prompt){
  if(!(window.puter&amp;&amp;puter.ai&amp;&amp;puter.ai.chat)) throw new Error(&quot;puter unavailable&quot;);
  let lastErr=null;
  for(const m of PUTER_MODELS){
    try{
      const r=await puter.ai.chat(prompt, m?{model:m}:{});
      const t=puterText(r);
      if(t&amp;&amp;t.trim()) return t.trim();
    }catch(e){ lastErr=e; }
  }
  throw lastErr||new Error(&quot;no reply&quot;);
}
async function answerWithAI(q){
  const prompt=buildClaudePrompt(q); // reuse the rich tutor prompt (lesson + code + run result)
  if(GROQKEY){ try{ return await callGroq(prompt); }catch(e){} }
  return await callPuter(prompt);
}

function helperAsk(q){
  lastQuestion=q;
  helperAdd(&quot;user&quot;,esc(q));
  const d=helperAdd(&quot;bot&quot;,&quot;<i>🦙 Llama is thinking…</i>&quot;);
  const box=document.getElementById(&quot;helperMsgs&quot;);
  answerWithAI(q)
    .then(t=>{ d.innerHTML=formatAI(t); box.scrollTop=1e9; })
    .catch(()=>{ d.innerHTML=helperAnswer(q)+'<br><br><span style=&quot;font-size:11px;color:var(--cream-dim)&quot;>(That was my quick built-in answer — the free Llama AI needs internet, and may ask you to sign in to a free account the first time. You can also tap ✦ Ask Claude.)</span>'; box.scrollTop=1e9; });
}
function helperOpen(){
  document.getElementById(&quot;helperPanel&quot;).style.display=&quot;flex&quot;;
  const box=document.getElementById(&quot;helperMsgs&quot;);
  if(!box.dataset.seeded){
    box.dataset.seeded=&quot;1&quot;;
    helperAdd(&quot;bot&quot;,&quot;Namaste! I'm your <b>Llama AI</b> tutor — free, no API key. 🦙 Ask me any Python doubt and I'll answer right here. (First time online, it may pop up a quick free sign-in.) Offline, I'll still give quick built-in answers, and ✦ Ask Claude uses your subscription.&quot;);
    const chips=document.getElementById(&quot;helperChips&quot;);
    chips.innerHTML=&quot;&quot;;
    CHIPS.forEach(c=>{const b=document.createElement(&quot;button&quot;);b.className=&quot;chip&quot;;b.textContent=c;b.addEventListener(&quot;click&quot;,()=>helperAsk(c));chips.appendChild(b);});
  }
}
document.getElementById(&quot;helperFab&quot;).addEventListener(&quot;click&quot;,helperOpen);
document.getElementById(&quot;helperClose&quot;).addEventListener(&quot;click&quot;,()=>{document.getElementById(&quot;helperPanel&quot;).style.display=&quot;none&quot;;});
document.getElementById(&quot;helperClaude&quot;).addEventListener(&quot;click&quot;,askClaude);
document.getElementById(&quot;helperSend&quot;).addEventListener(&quot;click&quot;,()=>{const t=document.getElementById(&quot;helperText&quot;);if(t.value.trim()){helperAsk(t.value.trim());t.value=&quot;&quot;;}});
document.getElementById(&quot;helperText&quot;).addEventListener(&quot;keydown&quot;,e=>{if(e.key===&quot;Enter&quot;){const t=e.target;if(t.value.trim()){helperAsk(t.value.trim());t.value=&quot;&quot;;}}});
document.getElementById(&quot;helperSettings&quot;).addEventListener(&quot;click&quot;,()=>{const s=document.getElementById(&quot;aiSetup&quot;);const show=s.style.display===&quot;none&quot;;s.style.display=show?&quot;block&quot;:&quot;none&quot;;if(show)document.getElementById(&quot;aiKey&quot;).value=GROQKEY;});
document.getElementById(&quot;aiSave&quot;).addEventListener(&quot;click&quot;,async()=>{const k=document.getElementById(&quot;aiKey&quot;).value.trim();GROQKEY=k;try{await Store.set(&quot;pq-groqkey&quot;,k);}catch(e){}document.getElementById(&quot;aiSetup&quot;).style.display=&quot;none&quot;;updateModeUI();helperAdd(&quot;bot&quot;,k?&quot;Groq key saved — Llama answers will be faster and need no sign-in. 🦙&quot;:&quot;No key — still using the free built-in Llama AI.&quot;);});
document.getElementById(&quot;aiRemove&quot;).addEventListener(&quot;click&quot;,async()=>{GROQKEY=&quot;&quot;;try{await Store.set(&quot;pq-groqkey&quot;,&quot;&quot;);}catch(e){}document.getElementById(&quot;aiKey&quot;).value=&quot;&quot;;document.getElementById(&quot;aiSetup&quot;).style.display=&quot;none&quot;;updateModeUI();helperAdd(&quot;bot&quot;,&quot;Groq key removed — back to the free built-in Llama AI.&quot;);});

/* ===================== BOOT ===================== */
(async function(){ await loadState(); renderAll(); await loadKey(); })();
